<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Combining Mark Tester</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: light dark;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: Canvas;
      color: CanvasText;
    }
    .card {
      width: min(92vw, 560px);
      padding: 24px;
      border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
      border-radius: 16px;
      box-sizing: border-box;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.35rem;
    }
    p {
      margin: 0 0 18px;
      line-height: 1.55;
      opacity: .8;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid color-mix(in srgb, CanvasText 22%, transparent);
      font-size: 1rem;
      background: Canvas;
      color: CanvasText;
    }
    .row {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    button {
      flex: 1;
      padding: 12px 14px;
      border: 0;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .meta {
      margin-top: 14px;
      font-size: .9rem;
      opacity: .75;
      min-height: 1.4em;
    }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>結合文字テスター</h1>
    <p>
      基底文字 <code>a</code> に複数のUnicode結合文字を重ねた単位を作り、
      指定回数ぶん生成してクリップボードへコピーします。
      生成結果そのものはページに表示しません。
    </p>

    <label for="count">繰り返し回数</label>
    <input id="count" type="number" min="1" max="1000" value="100" inputmode="numeric" />

    <div class="row">
      <button id="copyBtn" type="button">生成してコピー</button>
    </div>

    <div class="meta" id="status">安全上限: 1000回</div>
  </main>

  <script>
    // 1単位: 基底文字 "a" + 複数の結合文字。
    // 画面描画の検証用として、ブラウザ側で指定回数を生成し、画面には実体を描画しません。
    const unit =
      "a" +
      "\u0300" + // combining grave accent
      "\u0301" + // combining acute accent
      "\u0302" + // combining circumflex accent
      "\u0303" + // combining tilde
      "\u0304" + // combining macron
      "\u0307" + // combining dot above
      "\u0308" + // combining diaeresis
      "\u030A" + // combining ring above
      "\u0323" + // combining dot below
      "\u0324" + // combining diaeresis below
      "\u0327" + // combining cedilla
      "\u0334";  // combining tilde overlay

    const MAX_REPEAT = 1000;

    const countEl = document.getElementById("count");
    const statusEl = document.getElementById("status");
    const copyBtn = document.getElementById("copyBtn");

    copyBtn.addEventListener("click", async () => {
      let count = Number.parseInt(countEl.value, 10);

      if (!Number.isFinite(count)) count = 1;
      count = Math.max(1, Math.min(MAX_REPEAT, count));
      countEl.value = count;

      const payload = unit.repeat(count);

      try {
        await navigator.clipboard.writeText(payload);
        statusEl.textContent =
          `コピーしました: ${count}単位 / ${[...payload].length}コードポイント`;
      } catch {
        // Clipboard APIが使えない環境向けのフォールバック。
        const ta = document.createElement("textarea");
        ta.value = payload;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        ta.style.pointerEvents = "none";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();

        statusEl.textContent =
          `コピーしました: ${count}単位 / ${[...payload].length}コードポイント`;
      }
    });
  </script>
</body>
</html>
