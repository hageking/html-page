name: DFS demo E2E

on:
  push:
    branches: [main]
    paths:
      - 'dfs-manim-demo.html'
      - '.github/workflows/dfs-e2e.yml'
  workflow_dispatch:

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium --with-deps

      - name: Compare reference BFS and published DFS in Chromium
        run: |
          cat > test-dfs.mjs <<'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({headless:true});

          async function inspect(url, screenshot, waitMs) {
            const page = await browser.newPage({viewport:{width:1200,height:675}});
            const errors=[];
            page.on('pageerror', e=>errors.push(String(e)));
            page.on('console', m=>{ if(m.type()==='error') errors.push(`console: ${m.text()}`); });
            const res=await page.goto(`${url}${url.includes('?')?'&':'?'}e2e=${Date.now()}`, {waitUntil:'networkidle',timeout:30000});
            await page.waitForSelector('canvas',{timeout:15000});
            await page.waitForTimeout(waitMs);
            const result=await page.evaluate(()=>{
              const c=document.querySelector('canvas');
              const ctx=c.getContext('2d');
              const w=c.width,h=c.height,d=ctx.getImageData(0,0,w,h).data;
              let minX=w,minY=h,maxX=-1,maxY=-1,nonBlack=0,bright=0;
              for(let y=0;y<h;y+=3){for(let x=0;x<w;x+=3){
                const i=(y*w+x)*4,r=d[i],g=d[i+1],b=d[i+2],a=d[i+3];
                if(a&&(r>8||g>8||b>8)){nonBlack++;minX=Math.min(minX,x);minY=Math.min(minY,y);maxX=Math.max(maxX,x);maxY=Math.max(maxY,y);}
                if(r+g+b>180) bright++;
              }}
              return {width:w,height:h,nonBlack,bright,bounds:[minX,minY,maxX,maxY],graphU:typeof Graph_U,tracer:typeof Tracer,p5Type:typeof p5};
            });
            await page.screenshot({path:screenshot,fullPage:true});
            await page.close();
            return {http:res?.status(),errors,result};
          }

          const ref=await inspect('https://www.jazonjiao.com/demo/bfs/','reference-bfs.png',17000);
          console.log('REFERENCE',JSON.stringify(ref));
          const dfs=await inspect('https://hageking.github.io/html-page/dfs-manim-demo.html','dfs-e2e.png',17000);
          console.log('DFS',JSON.stringify(dfs));
          await browser.close();

          if(ref.errors.length) throw new Error(`Reference browser errors: ${ref.errors.join('\n')}`);
          if(dfs.errors.length) throw new Error(`DFS browser errors: ${dfs.errors.join('\n')}`);
          if(dfs.result.graphU!=='function'||dfs.result.tracer!=='function'||dfs.result.p5Type!=='function') throw new Error(`Manim.js missing: ${JSON.stringify(dfs.result)}`);
          if(dfs.result.nonBlack<500||dfs.result.bright<100) throw new Error(`DFS blank: ${JSON.stringify(dfs.result)}`);
          EOF
          node ./test-dfs.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dfs-reference-comparison
          path: |
            reference-bfs.png
            dfs-e2e.png
          if-no-files-found: ignore
