<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Manim Style Demo Chart</title>
<style>
:root{--bg:#0b0f14;--panel:#101722;--text:#f4f7fb;--muted:#91a0b5;--cyan:#58c4dd;--green:#83c167}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#0b0f14;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding:14px;display:flex;align-items:center;justify-content:center}
.card{width:100%;max-width:980px;min-height:500px;padding:24px;border:1px solid rgba(255,255,255,.08);border-radius:24px;background:radial-gradient(circle at 15% 0%,rgba(88,196,221,.12),transparent 32%),linear-gradient(180deg,#101722,#0d131c);box-shadow:0 22px 70px rgba(0,0,0,.35)}
.head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--cyan);margin-bottom:6px}.title{margin:0;font-size:30px;letter-spacing:-.03em}.sub{margin:8px 0 0;color:var(--muted);font-size:13px}.metric{text-align:right}.value{font-size:38px;font-weight:800}.label{font-size:12px;color:var(--muted);margin-top:4px}.delta{font-size:12px;color:var(--green);margin-top:7px}
.chart{margin-top:10px;width:100%;height:auto;display:block}.grid{stroke:rgba(255,255,255,.08);stroke-width:1}.axis{stroke:rgba(255,255,255,.55);stroke-width:1.3}.tick{fill:var(--muted);font-size:12px}.ylabel{fill:var(--muted);font-size:11px}.area{fill:url(#fill);opacity:0;animation:fade 1.2s ease 1s forwards}.series{fill:none;stroke:var(--cyan);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1200;stroke-dashoffset:1200;filter:drop-shadow(0 0 7px rgba(88,196,221,.30));animation:draw 2.2s cubic-bezier(.2,.8,.2,1) .2s forwards}.dot{fill:#101722;stroke:var(--cyan);stroke-width:3;opacity:0;animation:pop .28s ease forwards}.footer{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:2px}.legend{display:flex;gap:7px;align-items:center}.legend i{width:18px;height:3px;border-radius:4px;background:var(--cyan)}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes fade{to{opacity:.8}}@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@media(max-width:640px){body{padding:8px}.card{padding:17px;border-radius:18px;min-height:430px}.title{font-size:24px}.value{font-size:28px}.sub{display:none}.tick{font-size:10px}.ylabel{font-size:10px}}
@media(prefers-reduced-motion:reduce){.series{stroke-dashoffset:0;animation:none}.area{opacity:.8;animation:none}.dot{opacity:1;animation:none}}
</style>
</head>
<body>
<main class="card">
<header class="head"><div><div class="eyebrow">ANIMATED DATA DEMO</div><h1 class="title">月別売上の推移</h1><p class="sub">Demo Company / 2026 · illustrative data</p></div><div class="metric"><div class="value">¥92M</div><div class="label">最新月の売上</div><div class="delta">+18.4% YTD</div></div></header>
<svg class="chart" viewBox="0 0 920 390" role="img" aria-label="2026年1月から12月までのデモ売上推移">
<defs><linearGradient id="fill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#58c4dd" stop-opacity=".30"/><stop offset="1" stop-color="#58c4dd" stop-opacity="0"/></linearGradient></defs>
<g class="grid"><line x1="66" x2="890" y1="287.7" y2="287.7"/><line x1="66" x2="890" y1="199.1" y2="199.1"/><line x1="66" x2="890" y1="110.6" y2="110.6"/><line x1="66" x2="890" y1="22" y2="22"/></g>
<line class="axis" x1="66" x2="66" y1="22" y2="332"/><line class="axis" x1="66" x2="890" y1="332" y2="332"/>
<g class="ylabel"><text x="54" y="292" text-anchor="end">40</text><text x="54" y="203" text-anchor="end">60</text><text x="54" y="115" text-anchor="end">80</text><text x="54" y="26" text-anchor="end">100</text></g>
<g class="tick"><text x="66" y="360" text-anchor="middle">1月</text><text x="140.91" y="360" text-anchor="middle">2月</text><text x="215.82" y="360" text-anchor="middle">3月</text><text x="290.73" y="360" text-anchor="middle">4月</text><text x="365.64" y="360" text-anchor="middle">5月</text><text x="440.55" y="360" text-anchor="middle">6月</text><text x="515.45" y="360" text-anchor="middle">7月</text><text x="590.36" y="360" text-anchor="middle">8月</text><text x="665.27" y="360" text-anchor="middle">9月</text><text x="740.18" y="360" text-anchor="middle">10月</text><text x="815.09" y="360" text-anchor="middle">11月</text><text x="890" y="360" text-anchor="middle">12月</text></g>
<path class="area" d="M66 278.86 L140.91 261.14 L215.82 270 L290.73 234.57 L365.64 216.86 L440.55 194.71 L515.45 203.57 L590.36 163.71 L665.27 141.57 L740.18 123.86 L815.09 92.86 L890 57.43 L890 332 L66 332 Z"/>
<path class="series" d="M66 278.86 L140.91 261.14 L215.82 270 L290.73 234.57 L365.64 216.86 L440.55 194.71 L515.45 203.57 L590.36 163.71 L665.27 141.57 L740.18 123.86 L815.09 92.86 L890 57.43"/>
<g>
<circle class="dot" style="transform-origin:66px 278.86px;animation-delay:.35s" cx="66" cy="278.86" r="5"/><circle class="dot" style="transform-origin:140.91px 261.14px;animation-delay:.52s" cx="140.91" cy="261.14" r="5"/><circle class="dot" style="transform-origin:215.82px 270px;animation-delay:.69s" cx="215.82" cy="270" r="5"/><circle class="dot" style="transform-origin:290.73px 234.57px;animation-delay:.86s" cx="290.73" cy="234.57" r="5"/><circle class="dot" style="transform-origin:365.64px 216.86px;animation-delay:1.03s" cx="365.64" cy="216.86" r="5"/><circle class="dot" style="transform-origin:440.55px 194.71px;animation-delay:1.20s" cx="440.55" cy="194.71" r="5"/><circle class="dot" style="transform-origin:515.45px 203.57px;animation-delay:1.37s" cx="515.45" cy="203.57" r="5"/><circle class="dot" style="transform-origin:590.36px 163.71px;animation-delay:1.54s" cx="590.36" cy="163.71" r="5"/><circle class="dot" style="transform-origin:665.27px 141.57px;animation-delay:1.71s" cx="665.27" cy="141.57" r="5"/><circle class="dot" style="transform-origin:740.18px 123.86px;animation-delay:1.88s" cx="740.18" cy="123.86" r="5"/><circle class="dot" style="transform-origin:815.09px 92.86px;animation-delay:2.05s" cx="815.09" cy="92.86" r="5"/><circle class="dot" style="transform-origin:890px 57.43px;animation-delay:2.22s" cx="890" cy="57.43" r="5"/>
</g>
</svg>
<footer class="footer"><div class="legend"><i></i><span>売上高</span></div><span>単位: 百万円 · デモデータ</span></footer>
</main>
</body>
</html>
