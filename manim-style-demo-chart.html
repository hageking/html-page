<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Manim Style Animated Chart</title>
  <style>
    :root{
      --bg:#0b0f14;
      --panel:#101722;
      --panel-2:#0d131c;
      --grid:rgba(255,255,255,.08);
      --axis:rgba(255,255,255,.55);
      --text:#f3f7fb;
      --muted:#91a0b5;
      --line:#58c4dd;
      --line2:#83c167;
      --accent:#ffd166;
    }
    *{box-sizing:border-box}
    html,body{
      width:100%;
      height:100%;
      margin:0;
      background:transparent;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--text);
      overflow:hidden;
    }
    body{
      display:grid;
      place-items:center;
      padding:12px;
    }
    .card{
      width:min(980px,100%);
      height:min(560px,calc(100vh - 24px));
      min-height:420px;
      background:
        radial-gradient(circle at 18% 0%, rgba(88,196,221,.10), transparent 30%),
        linear-gradient(180deg,var(--panel),var(--panel-2));
      border:1px solid rgba(255,255,255,.08);
      border-radius:24px;
      box-shadow:0 22px 70px rgba(0,0,0,.38);
      padding:24px 26px 20px;
      display:flex;
      flex-direction:column;
      position:relative;
      isolation:isolate;
    }
    .card::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius:inherit;
      pointer-events:none;
      background:linear-gradient(110deg,rgba(255,255,255,.045),transparent 24%);
      z-index:-1;
    }
    .head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:18px;
      margin-bottom:10px;
    }
    .eyebrow{
      color:var(--line);
      font-size:12px;
      letter-spacing:.16em;
      text-transform:uppercase;
      margin-bottom:5px;
    }
    h1{
      font-size:clamp(22px,3vw,32px);
      line-height:1.05;
      margin:0;
      font-weight:760;
      letter-spacing:-.035em;
    }
    .sub{
      margin:8px 0 0;
      color:var(--muted);
      font-size:13px;
    }
    .metric{
      text-align:right;
      min-width:140px;
    }
    .metric .value{
      font-variant-numeric:tabular-nums;
      font-size:clamp(25px,3vw,38px);
      font-weight:780;
      line-height:1;
    }
    .metric .label{
      margin-top:7px;
      color:var(--muted);
      font-size:12px;
    }
    .metric .delta{
      display:inline-block;
      margin-top:7px;
      color:var(--line2);
      font-size:12px;
      border:1px solid rgba(131,193,103,.22);
      background:rgba(131,193,103,.08);
      padding:4px 8px;
      border-radius:999px;
    }
    .chart-wrap{
      flex:1;
      min-height:0;
      position:relative;
    }
    svg{
      width:100%;
      height:100%;
      display:block;
      overflow:visible;
    }
    .grid line{
      stroke:var(--grid);
      stroke-width:1;
    }
    .axis{
      stroke:var(--axis);
      stroke-width:1.25;
      stroke-linecap:round;
    }
    .tick{
      fill:var(--muted);
      font-size:12px;
    }
    .ylabel{
      fill:var(--muted);
      font-size:11px;
    }
    .series{
      fill:none;
      stroke:var(--line);
      stroke-width:4;
      stroke-linecap:round;
      stroke-linejoin:round;
      filter:drop-shadow(0 0 8px rgba(88,196,221,.28));
    }
    .area{
      fill:url(#areaGradient);
      opacity:.9;
    }
    .dot{
      fill:var(--panel);
      stroke:var(--line);
      stroke-width:3;
    }
    .halo{
      fill:var(--line);
      opacity:.12;
    }
    .guide{
      stroke:rgba(255,255,255,.18);
      stroke-width:1;
      stroke-dasharray:4 6;
      opacity:0;
    }
    .tooltip{
      position:absolute;
      pointer-events:none;
      opacity:0;
      transform:translate(-50%,-115%);
      transition:opacity .15s ease;
      background:rgba(7,11,17,.94);
      border:1px solid rgba(255,255,255,.12);
      border-radius:12px;
      padding:8px 10px;
      box-shadow:0 10px 30px rgba(0,0,0,.35);
      white-space:nowrap;
      font-size:12px;
    }
    .tooltip b{
      color:var(--line);
      font-size:14px;
    }
    .footer{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      color:var(--muted);
      font-size:11px;
      margin-top:2px;
    }
    .legend{
      display:flex;
      align-items:center;
      gap:7px;
    }
    .legend i{
      display:block;
      width:18px;
      height:3px;
      border-radius:999px;
      background:var(--line);
    }
    @media (max-width:650px){
      .card{padding:18px 16px 14px;border-radius:18px}
      .metric{min-width:115px}
      .sub{display:none}
      .tick{font-size:10px}
      .ylabel{font-size:10px}
    }
    @media (prefers-reduced-motion: reduce){
      *{animation:none!important;transition:none!important}
    }
  </style>
</head>
<body>
  <main class="card" aria-label="Manim風の売上推移グラフ">
    <header class="head">
      <div>
        <div class="eyebrow">Animated Data Demo</div>
        <h1>月別売上の推移</h1>
        <p class="sub">Demo Company / 2026 · values are illustrative</p>
      </div>
      <div class="metric">
        <div class="value" id="metricValue">¥0</div>
        <div class="label">最新月の売上</div>
        <div class="delta">+18.4% YTD</div>
      </div>
    </header>

    <section class="chart-wrap" id="chartWrap">
      <svg id="chart" viewBox="0 0 920 390" role="img" aria-label="1月から12月までの売上推移">
        <defs>
          <linearGradient id="areaGradient" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stop-color="#58c4dd" stop-opacity=".30"/>
            <stop offset="100%" stop-color="#58c4dd" stop-opacity="0"/>
          </linearGradient>
          <clipPath id="plotClip">
            <rect x="66" y="22" width="824" height="310" rx="8"/>
          </clipPath>
        </defs>
        <g id="grid" class="grid"></g>
        <g id="axes"></g>
        <g id="labels"></g>
        <g clip-path="url(#plotClip)">
          <path id="area" class="area"></path>
          <line id="guide" class="guide" y1="22" y2="332"></line>
          <path id="series" class="series"></path>
          <g id="points"></g>
        </g>
      </svg>
      <div class="tooltip" id="tooltip"></div>
    </section>

    <footer class="footer">
      <div class="legend"><i></i><span>売上高</span></div>
      <span>単位: 百万円 · デモデータ</span>
    </footer>
  </main>

  <script>
    const data = [
      {m:"1月", v:42},{m:"2月", v:46},{m:"3月", v:44},{m:"4月", v:52},
      {m:"5月", v:56},{m:"6月", v:61},{m:"7月", v:59},{m:"8月", v:68},
      {m:"9月", v:73},{m:"10月", v:77},{m:"11月", v:84},{m:"12月", v:92}
    ];

    const svg = document.getElementById("chart");
    const grid = document.getElementById("grid");
    const axes = document.getElementById("axes");
    const labels = document.getElementById("labels");
    const series = document.getElementById("series");
    const area = document.getElementById("area");
    const points = document.getElementById("points");
    const guide = document.getElementById("guide");
    const tooltip = document.getElementById("tooltip");
    const chartWrap = document.getElementById("chartWrap");
    const metricValue = document.getElementById("metricValue");

    const NS = "http://www.w3.org/2000/svg";
    const left = 66, right = 890, top = 22, bottom = 332;
    const minY = 30, maxY = 100;
    const width = right-left, height = bottom-top;

    const x = i => left + i * (width/(data.length-1));
    const y = v => bottom - ((v-minY)/(maxY-minY))*height;

    function el(tag, attrs={}, text=""){
      const n = document.createElementNS(NS, tag);
      Object.entries(attrs).forEach(([k,v]) => n.setAttribute(k,v));
      if(text) n.textContent = text;
      return n;
    }

    [40,60,80,100].forEach(v=>{
      grid.appendChild(el("line",{x1:left,x2:right,y1:y(v),y2:y(v)}));
      labels.appendChild(el("text",{x:left-12,y:y(v)+4,"text-anchor":"end",class:"ylabel"},v));
    });

    axes.appendChild(el("line",{x1:left,x2:left,y1:top,y2:bottom,class:"axis"}));
    axes.appendChild(el("line",{x1:left,x2:right,y1:bottom,y2:bottom,class:"axis"}));

    data.forEach((d,i)=>{
      labels.appendChild(el("text",{x:x(i),y:bottom+28,"text-anchor":"middle",class:"tick"},d.m));
    });

    const coords = data.map((d,i)=>[x(i),y(d.v)]);
    const pathD = coords.map((p,i)=>(i?"L":"M")+p[0]+","+p[1]).join(" ");
    const areaD = pathD + ` L ${x(data.length-1)},${bottom} L ${x(0)},${bottom} Z`;
    series.setAttribute("d",pathD);
    area.setAttribute("d",areaD);

    const totalLength = series.getTotalLength();
    series.style.strokeDasharray = totalLength;
    series.style.strokeDashoffset = totalLength;
    area.style.opacity = 0;

    const pointEls = [];
    coords.forEach(([cx,cy],i)=>{
      const g = el("g",{"data-i":i,style:"opacity:0;cursor:pointer"});
      const halo = el("circle",{cx,cy,r:12,class:"halo"});
      const dot = el("circle",{cx,cy,r:5,class:"dot"});
      g.append(halo,dot);
      points.appendChild(g);
      pointEls.push(g);

      g.addEventListener("mouseenter",()=>showTip(i,cx,cy));
      g.addEventListener("mouseleave",hideTip);
      g.addEventListener("touchstart",(e)=>{e.preventDefault();showTip(i,cx,cy)},{passive:false});
    });

    function showTip(i,cx,cy){
      const rect = svg.getBoundingClientRect();
      const wrapRect = chartWrap.getBoundingClientRect();
      const px = (cx/920)*rect.width + (rect.left-wrapRect.left);
      const py = (cy/390)*rect.height + (rect.top-wrapRect.top);
      tooltip.style.left = px+"px";
      tooltip.style.top = py+"px";
      tooltip.innerHTML = `${data[i].m}<br><b>¥${data[i].v}M</b>`;
      tooltip.style.opacity = 1;
      guide.setAttribute("x1",cx); guide.setAttribute("x2",cx); guide.style.opacity = 1;
    }
    function hideTip(){
      tooltip.style.opacity = 0;
      guide.style.opacity = 0;
    }

    function easeOutCubic(t){ return 1-Math.pow(1-t,3); }

    function animate(){
      const duration = 2200;
      const start = performance.now();
      function frame(now){
        const t = Math.min(1,(now-start)/duration);
        const e = easeOutCubic(t);
        series.style.strokeDashoffset = totalLength*(1-e);
        area.style.opacity = Math.max(0,(t-.18)/.82)*.78;

        pointEls.forEach((g,i)=>{
          const threshold = i/(data.length-1);
          if(e > threshold){
            const local = Math.min(1,(e-threshold)*8);
            g.style.opacity = local;
            g.style.transformOrigin = `${coords[i][0]}px ${coords[i][1]}px`;
            g.style.transform = `scale(${.4+.6*local})`;
          }
        });

        const value = Math.round(data[data.length-1].v * e);
        metricValue.textContent = `¥${value}M`;

        if(t<1) requestAnimationFrame(frame);
        else pulseLast();
      }
      requestAnimationFrame(frame);
    }

    function pulseLast(){
      const g = pointEls[pointEls.length-1];
      const halo = g.querySelector(".halo");
      halo.animate([
        {transform:"scale(.65)",opacity:.16},
        {transform:"scale(1.35)",opacity:.03},
        {transform:"scale(.65)",opacity:.16}
      ],{duration:1800,iterations:Infinity,easing:"ease-in-out",transformOrigin:"center"});
    }

    const observer = new IntersectionObserver(entries=>{
      if(entries[0].isIntersecting){
        animate();
        observer.disconnect();
      }
    },{threshold:.35});
    observer.observe(document.querySelector(".card"));
  </script>
</body>
</html>
