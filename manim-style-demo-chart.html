<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Manim.js Sales Chart Demo</title>
<style>
  :root{color-scheme:dark;--bg:#080b10;--panel:#0d131c;--line:#58c4dd;--muted:#91a0b5;--text:#f4f7fb}
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;min-height:100%;background:transparent;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  body{display:grid;place-items:center;padding:12px;background:#080b10}
  .card{position:relative;width:min(1000px,100%);overflow:hidden;border:1px solid rgba(255,255,255,.09);border-radius:24px;background:linear-gradient(180deg,#101722,#0b1018);box-shadow:0 24px 80px rgba(0,0,0,.42)}
  #stage{width:100%;aspect-ratio:1000/560;background:#0b0f14}
  #stage canvas{display:block!important;width:100%!important;height:auto!important}
  #status{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;letter-spacing:.02em;pointer-events:none;background:linear-gradient(180deg,#101722,#0b1018)}
  .replay{position:absolute;top:18px;right:18px;z-index:4;border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:8px 12px;background:rgba(8,12,18,.72);color:#cbd5e1;font:600 12px/1 system-ui,-apple-system,sans-serif;backdrop-filter:blur(8px);cursor:pointer}
  .replay:hover{border-color:rgba(88,196,221,.45);color:white}
  .credit{position:absolute;right:20px;bottom:12px;z-index:3;color:rgba(145,160,181,.65);font:10px/1.3 system-ui,-apple-system,sans-serif;pointer-events:none}
  @media(max-width:640px){body{padding:6px}.card{border-radius:16px}.replay{top:10px;right:10px;padding:7px 10px}}
</style>
</head>
<body>
  <main class="card" aria-label="Manim.jsで描画する月別売上デモグラフ">
    <div id="stage"></div>
    <div id="status">Loading Manim.js…</div>
    <button class="replay" type="button" onclick="bootManimChart()">Replay</button>
    <div class="credit">Manim.js + p5.js · demo data</div>
  </main>

  <script src="https://cdn.jsdelivr.net/gh/JazonJiao/Manim.js@2ee63dfba544ead13bc84c8df72f769b768f3fa4/lib/p5/p5.min.js" onerror="document.getElementById('status').textContent='p5.js の読み込みに失敗しました'"></script>
  <script src="https://cdn.jsdelivr.net/gh/JazonJiao/Manim.js@2ee63dfba544ead13bc84c8df72f769b768f3fa4/Manim.js" onerror="document.getElementById('status').textContent='Manim.js の読み込みに失敗しました'"></script>
  <script>
  const SALES = [
    {m:'1月',v:42},{m:'2月',v:46},{m:'3月',v:44},{m:'4月',v:52},
    {m:'5月',v:56},{m:'6月',v:61},{m:'7月',v:59},{m:'8月',v:68},
    {m:'9月',v:73},{m:'10月',v:77},{m:'11月',v:84},{m:'12月',v:92}
  ];

  let manimInstance = null;

  function bootManimChart(){
    const status = document.getElementById('status');
    if(typeof p5 !== 'function' || typeof Line !== 'function' || typeof Timer2 !== 'function'){
      status.style.display = 'grid';
      status.textContent = 'Manim.js を読み込めませんでした';
      return;
    }
    if(manimInstance) manimInstance.remove();
    document.getElementById('stage').innerHTML = '';
    status.style.display = 'grid';
    status.textContent = 'Rendering with Manim.js…';

    try{ fr = 60; }catch(e){}

    const Scene = function(s){
      const W=1000,H=560;
      const P={left:88,right:946,top:166,bottom:448};
      const C={bg:[10,14,20],grid:[31,41,54],axis:[151,165,183],cyan:[88,196,221],glow:[25,72,88],green:[131,193,103],muted:[145,160,181],white:[244,247,251]};
      const YMIN=30,YMAX=100;
      const x=i=>P.left+i*(P.right-P.left)/(SALES.length-1);
      const y=v=>P.bottom-((v-YMIN)/(YMAX-YMIN))*(P.bottom-P.top);
      let gridLines=[],axes=[],glowLines=[],series=[],pts=[];
      let titleTimer,kpiTimer,areaTimer;

      class SalesPoint extends Point{
        show(){
          if(this.s.frameCount>this.start){
            this.t=this.timer.advance();
            const pulse=1+0.28*(1-this.t);
            this.s.noFill();
            this.s.stroke(...C.cyan);
            this.s.strokeWeight((1-this.t)*5);
            this.s.circle(this.x,this.y,this.radius*2.25*pulse);
            this.s.noStroke();
            this.s.fill(C.cyan[0],C.cyan[1],C.cyan[2],255*this.t);
            this.s.circle(this.x,this.y,this.radius*this.t);
          }
        }
      }

      s.setup=function(){
        const canvas=s.createCanvas(W,H);
        canvas.parent('stage');
        s.frameRate(60);
        s.pixelDensity(Math.min(window.devicePixelRatio||1,2));
        s.textFont('system-ui');
        s.strokeCap(s.ROUND);

        titleTimer=new Timer2(frames(.8));
        kpiTimer=new Timer2(frames(1.45));
        areaTimer=new Timer2(frames(.85));

        [40,60,80,100].forEach((v,i)=>{
          gridLines.push(new Line(s,{x1:P.left,y1:y(v),x2:P.right,y2:y(v),color:C.grid,strokeweight:1,duration:.55,start:frames(.28+i*.06),mode:2}));
        });

        axes.push(new Line(s,{x1:P.left,y1:P.bottom,x2:P.right,y2:P.bottom,color:C.axis,strokeweight:2,duration:.8,start:frames(.12),mode:2}));
        axes.push(new Line(s,{x1:P.left,y1:P.bottom,x2:P.left,y2:P.top,color:C.axis,strokeweight:2,duration:.8,start:frames(.12),mode:2}));

        for(let i=0;i<SALES.length-1;i++){
          const start=frames(1.05+i*.105);
          const base={x1:x(i),y1:y(SALES[i].v),x2:x(i+1),y2:y(SALES[i+1].v),duration:.34,start,mode:2};
          glowLines.push(new Line(s,{...base,color:C.glow,strokeweight:11}));
          series.push(new Line(s,{...base,color:C.cyan,strokeweight:4}));
        }
        SALES.forEach((d,i)=>{
          pts.push(new SalesPoint(s,{x:x(i),y:y(d.v),radius:11,color:C.cyan,start:frames(1.08+i*.105+.22)}));
        });
        status.style.display='none';
      };

      function header(alpha){
        s.noStroke();
        s.fill(C.cyan[0],C.cyan[1],C.cyan[2],alpha);
        s.textSize(12); s.textStyle(s.BOLD); s.textAlign(s.LEFT,s.TOP);
        s.text('ANIMATED DATA DEMO',48,30);
        s.fill(C.white[0],C.white[1],C.white[2],alpha);
        s.textSize(31); s.textStyle(s.BOLD);
        s.text('月別売上の推移',48,53);
        s.fill(C.muted[0],C.muted[1],C.muted[2],alpha);
        s.textSize(13); s.textStyle(s.NORMAL);
        s.text('Demo Company / 2026 · illustrative data',48,96);
      }

      function metric(){
        let t=0;
        if(s.frameCount>frames(.42)) t=kpiTimer.advance();
        const val=Math.round(92*t);
        s.textAlign(s.RIGHT,s.TOP);
        s.noStroke();
        s.fill(...C.white); s.textStyle(s.BOLD); s.textSize(38);
        s.text('¥'+val+'M',944,48);
        s.fill(...C.muted); s.textStyle(s.NORMAL); s.textSize(12);
        s.text('最新月の売上',944,92);
        s.fill(...C.green); s.textSize(12); s.textStyle(s.BOLD);
        s.text('+9.5% MoM',944,113);
      }

      function labels(){
        s.noStroke();
        s.fill(...C.muted); s.textStyle(s.NORMAL); s.textSize(11);
        s.textAlign(s.RIGHT,s.CENTER);
        [40,60,80,100].forEach(v=>s.text(String(v),P.left-15,y(v)));
        s.textAlign(s.CENTER,s.TOP);
        SALES.forEach((d,i)=>s.text(d.m,x(i),P.bottom+16));
        s.textAlign(s.LEFT,s.TOP); s.textSize(10);
        s.text('百万円',P.left-2,P.top-24);
      }

      function area(){
        if(s.frameCount<=frames(2.22)) return;
        const t=areaTimer.advance();
        s.noStroke();
        s.fill(C.cyan[0],C.cyan[1],C.cyan[2],Math.round(37*t));
        s.beginShape();
        s.vertex(x(0),P.bottom);
        SALES.forEach((d,i)=>s.vertex(x(i),y(d.v)));
        s.vertex(x(SALES.length-1),P.bottom);
        s.endShape(s.CLOSE);
      }

      function hover(){
        if(s.frameCount<frames(2.35)) return;
        let best=-1,bestD=18;
        SALES.forEach((d,i)=>{
          const dist=s.dist(s.mouseX,s.mouseY,x(i),y(d.v));
          if(dist<bestD){bestD=dist;best=i;}
        });
        if(best<0) return;
        const px=x(best),py=y(SALES[best].v);
        s.stroke(88,196,221,90); s.strokeWeight(1);
        s.line(px,P.top,px,P.bottom);
        s.noStroke(); s.fill(7,11,17,235);
        const tw=106,th=48,tx=Math.min(Math.max(px-tw/2,P.left),P.right-tw),ty=Math.max(P.top,py-62);
        s.rect(tx,ty,tw,th,10);
        s.fill(...C.muted); s.textAlign(s.LEFT,s.TOP); s.textStyle(s.NORMAL); s.textSize(11);
        s.text(SALES[best].m,tx+11,ty+8);
        s.fill(...C.cyan); s.textStyle(s.BOLD); s.textSize(16);
        s.text('¥'+SALES[best].v+'M',tx+11,ty+23);
      }

      function footer(){
        s.noStroke(); s.fill(...C.cyan); s.rect(49,515,22,3,3);
        s.fill(...C.muted); s.textStyle(s.NORMAL); s.textAlign(s.LEFT,s.CENTER); s.textSize(11);
        s.text('売上高',78,516);
        s.textAlign(s.RIGHT,s.CENTER);
        s.text('単位: 百万円 · デモデータ',944,516);
      }

      s.draw=function(){
        s.background(...C.bg);
        const grad=s.drawingContext.createRadialGradient(150,0,0,150,0,380);
        grad.addColorStop(0,'rgba(88,196,221,.10)');
        grad.addColorStop(1,'rgba(88,196,221,0)');
        s.drawingContext.fillStyle=grad;
        s.drawingContext.fillRect(0,0,W,H);

        const ta=titleTimer.advance()*255;
        header(ta);
        metric();
        labels();
        gridLines.forEach(l=>l.show());
        axes.forEach(l=>l.show());
        area();
        glowLines.forEach(l=>l.show());
        series.forEach(l=>l.show());
        pts.forEach(p=>p.show());

        if(s.frameCount>frames(2.45)){
          const last=SALES.length-1,phase=(s.frameCount-frames(2.45))/60;
          const r=12+5*(.5+.5*Math.sin(phase*2.8));
          s.noFill(); s.stroke(88,196,221,55); s.strokeWeight(2); s.circle(x(last),y(SALES[last].v),r*2);
        }
        hover();
        footer();
      };
    };

    manimInstance=new p5(Scene);
  }

  bootManimChart();
  </script>
</body>
</html>
