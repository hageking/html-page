<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02040a"><title>Audio Reactive Particle Sphere</title>
<style>
:root{color-scheme:dark;--bg:#02040a;--glass:rgba(7,12,25,.58);--line:rgba(150,205,255,.17);--text:#eef7ff;--muted:rgba(220,236,255,.58)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg)}body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 50% 44%,rgba(33,88,170,.14),transparent 37%),radial-gradient(circle at 28% 25%,rgba(136,66,210,.08),transparent 27%),#02040a;touch-action:none}#stage{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}.overlay{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 46%,transparent 38%,rgba(0,0,0,.18) 66%,rgba(0,0,0,.72) 100%)}.topbar{position:fixed;z-index:5;top:max(16px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(820px,calc(100vw - 24px));display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 12px 11px 16px;border:1px solid var(--line);border-radius:18px;background:var(--glass);backdrop-filter:blur(18px) saturate(135%);-webkit-backdrop-filter:blur(18px) saturate(135%);box-shadow:0 18px 60px rgba(0,0,0,.3);touch-action:auto}.brand{min-width:0}.brand strong{display:block;font-size:12px;letter-spacing:.14em}.brand span{display:block;margin-top:3px;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;gap:7px;flex:0 0 auto}button{appearance:none;border:1px solid rgba(180,215,255,.18);border-radius:12px;padding:9px 11px;background:rgba(255,255,255,.055);color:var(--text);font:inherit;font-size:11px;font-weight:650;cursor:pointer}button.primary{background:linear-gradient(135deg,rgba(64,146,255,.29),rgba(166,72,255,.24))}button:disabled{opacity:.38;cursor:default}#file{display:none}.bottom{position:fixed;z-index:5;left:50%;bottom:max(17px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(600px,calc(100vw - 24px));touch-action:auto}.meter{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:16px;background:rgba(7,12,25,.46);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:10px;color:var(--muted)}.track{height:4px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}#level{height:100%;width:3%;border-radius:inherit;background:linear-gradient(90deg,#61c9ff,#8b78ff,#ff79d5);box-shadow:0 0 18px rgba(91,190,255,.55)}.hint{margin-top:8px;text-align:center;font-size:9px;line-height:1.5;color:rgba(215,232,255,.38)}#media{position:fixed;right:14px;bottom:88px;z-index:4;width:min(240px,42vw);max-height:150px;border:1px solid rgba(180,215,255,.15);border-radius:12px;background:#04060b;opacity:0;pointer-events:none;transition:.2s;touch-action:auto}#media.visible{opacity:.76;pointer-events:auto}@media(max-width:640px){.topbar{align-items:stretch}.brand span{max-width:120px}.actions{gap:5px}button{padding:9px 8px}#media{width:38vw}}
</style></head><body><div id="stage"></div><div class="overlay"></div><div class="topbar"><div class="brand"><strong>AUDIO PARTICLE SPHERE</strong><span id="status">動画・音声・マイクを選択</span></div><div class="actions"><input id="file" type="file" accept="video/*,audio/*"><button id="pick" class="primary">動画 / 音声</button><button id="mic">マイク</button><button id="play" disabled>再生</button></div></div><video id="media" playsinline preload="metadata" controls></video><div class="bottom"><div class="meter"><div class="track"><div id="level"></div></div><span id="readout">IDLE</span></div><div class="hint">ドラッグで回転 / ホイール・ピンチでズーム。低音=膨張、中音=表面波、高音=粒子の散乱。</div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js';
const $=id=>document.getElementById(id),stage=$('stage'),file=$('file'),pick=$('pick'),mic=$('mic'),play=$('play'),media=$('media'),status=$('status'),level=$('level'),readout=$('readout');const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x02040a,.035);const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);camera.position.set(0,0,11.6);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x02040a,1);stage.appendChild(renderer.domElement);const root=new THREE.Group();scene.add(root);const count=innerWidth<700?15000:30000,geo=new THREE.BufferGeometry(),pos=new Float32Array(count*3),dir=new Float32Array(count*3),rand=new Float32Array(count),phase=new Float32Array(count);for(let i=0;i<count;i++){const z=Math.random()*2-1,a=Math.random()*Math.PI*2,r=Math.sqrt(1-z*z),j=i*3;dir[j]=r*Math.cos(a);dir[j+1]=z;dir[j+2]=r*Math.sin(a);rand[i]=Math.random();phase[i]=Math.random()*Math.PI*2}geo.setAttribute('position',new THREE.BufferAttribute(pos,3));geo.setAttribute('aDir',new THREE.BufferAttribute(dir,3));geo.setAttribute('aRand',new THREE.BufferAttribute(rand,1));geo.setAttribute('aPhase',new THREE.BufferAttribute(phase,1));geo.boundingSphere=new THREE.Sphere(new THREE.Vector3(),10);const uniforms={uTime:{value:0},uBass:{value:0},uMid:{value:0},uHigh:{value:0},uEnergy:{value:0},uPixelRatio:{value:Math.min(devicePixelRatio,2)}};const mat=new THREE.ShaderMaterial({uniforms,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,vertexShader:`attribute vec3 aDir;attribute float aRand;attribute float aPhase;uniform float uTime,uBass,uMid,uHigh,uEnergy,uPixelRatio;varying float vRand,vGlow,vHigh;void main(){float bass=smoothstep(.025,.82,uBass),mid=smoothstep(.02,.72,uMid),high=smoothstep(.015,.6,uHigh);vec3 n=normalize(aDir);float az=atan(n.z,n.x);float el=asin(n.y);float large=sin(az*3.0+el*2.0-uTime*1.35+aPhase)*mid;float small=sin(az*(7.0+floor(aRand*7.0))-el*5.0+uTime*(1.4+aRand*2.0)+aPhase)*high;float noise=sin((n.x+n.y*1.7+n.z*2.3)*8.0+uTime*1.15+aPhase);float radius=3.15+1.05*pow(bass,1.22)+.28*large+.14*noise*mid;radius+=high*(.12+.56*pow(aRand,4.0))*max(0.0,small);vec3 tangent=normalize(cross(n,abs(n.y)>.88?vec3(1,0,0):vec3(0,1,0)));vec3 p=n*radius+tangent*(.10+.28*aRand)*small*high;p+=normalize(cross(n,tangent))*.13*large;vec4 mv=modelViewMatrix*vec4(p,1.0);gl_PointSize=(1.25+aRand*2.3+high*(1.2+aRand*3.2)+bass*.7)*uPixelRatio*(35.0/max(4.0,-mv.z));gl_Position=projectionMatrix*mv;vRand=aRand;vGlow=clamp(.24+uEnergy*.95+high*.55,0.0,1.55);vHigh=high;}`,fragmentShader:`precision highp float;varying float vRand,vGlow,vHigh;void main(){vec2 q=gl_PointCoord-.5;float d=length(q);if(d>.5)discard;float halo=smoothstep(.5,0.0,d),core=smoothstep(.14,0.0,d);vec3 c=mix(vec3(.25,.73,1.0),vec3(.72,.36,1.0),smoothstep(.08,.98,vRand));c=mix(c,vec3(.95,.98,1.0),core*.78+vHigh*.12);float a=halo*(.12+vGlow*.62)+core*.72;gl_FragColor=vec4(c,a);}`});const particles=new THREE.Points(geo,mat);root.add(particles);const haloMat=mat.clone();haloMat.uniforms=uniforms;haloMat.opacity=.22;const halo=new THREE.Points(geo,haloMat);halo.scale.setScalar(1.025);root.add(halo);const dustGeo=new THREE.BufferGeometry(),dustN=innerWidth<700?700:1300,dustPos=new Float32Array(dustN*3);for(let i=0;i<dustN;i++){const r=7+Math.random()*19,z=Math.random()*2-1,a=Math.random()*Math.PI*2,s=Math.sqrt(1-z*z),j=i*3;dustPos[j]=r*s*Math.cos(a);dustPos[j+1]=r*z;dustPos[j+2]=r*s*Math.sin(a)}dustGeo.setAttribute('position',new THREE.BufferAttribute(dustPos,3));const dust=new THREE.Points(dustGeo,new THREE.PointsMaterial({color:0x6ba8ff,size:.025,transparent:true,opacity:.28,depthWrite:false,blending:THREE.AdditiveBlending}));scene.add(dust);
let ctx,analyser,source,stream,freq,smBass=0,smMid=0,smHigh=0,smEnergy=0,url;function setupAudio(){if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();analyser=ctx.createAnalyser();analyser.fftSize=1024;analyser.smoothingTimeConstant=.78;freq=new Uint8Array(analyser.frequencyBinCount)}if(ctx.state==='suspended')ctx.resume()}function disconnect(){try{source?.disconnect()}catch{}source=null;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}function avg(lo,hi){if(!analyser)return 0;const ny=ctx.sampleRate/2,a=Math.floor(lo/ny*freq.length),b=Math.min(freq.length-1,Math.ceil(hi/ny*freq.length));let s=0,n=0;for(let i=a;i<=b;i++){s+=freq[i];n++}return n?s/n/255:0}function connectMedia(){setupAudio();disconnect();source=ctx.createMediaElementSource(media);source.connect(analyser);analyser.connect(ctx.destination)}pick.onclick=()=>file.click();file.onchange=()=>{const f=file.files?.[0];if(!f)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);media.src=url;media.classList.toggle('visible',f.type.startsWith('video/'));media.load();connectMedia();status.textContent=f.name;play.disabled=false;media.play().then(()=>play.textContent='一時停止').catch(()=>{}};play.onclick=()=>{setupAudio();media.paused?media.play():media.pause()};media.onplay=()=>play.textContent='一時停止';media.onpause=()=>play.textContent='再生';mic.onclick=async()=>{try{setupAudio();disconnect();stream=await navigator.mediaDevices.getUserMedia({audio:true});source=ctx.createMediaStreamSource(stream);source.connect(analyser);media.pause();media.removeAttribute('src');media.load();media.classList.remove('visible');play.disabled=true;status.textContent='マイク入力';readout.textContent='MIC'}catch(e){status.textContent='マイクを利用できません'}};
let dragging=false,lastX=0,lastY=0,targetX=-.08,targetY=0,rotX=-.08,rotY=0,zoom=11.6,pinch=0;renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!dragging)return;targetY+=(e.clientX-lastX)*.006;targetX+=(e.clientY-lastY)*.006;targetX=Math.max(-1.15,Math.min(1.15,targetX));lastX=e.clientX;lastY=e.clientY});renderer.domElement.addEventListener('pointerup',()=>dragging=false);renderer.domElement.addEventListener('wheel',e=>{zoom=Math.max(7.2,Math.min(17,zoom+e.deltaY*.008))},{passive:true});renderer.domElement.addEventListener('touchmove',e=>{if(e.touches.length===2){const a=e.touches[0],b=e.touches[1],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pinch)zoom=Math.max(7.2,Math.min(17,zoom+(pinch-d)*.018));pinch=d}},{passive:true});renderer.domElement.addEventListener('touchend',()=>pinch=0,{passive:true});const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();if(analyser){analyser.getByteFrequencyData(freq);const bass=avg(35,180),mid=avg(180,2200),high=avg(2200,12000),energy=bass*.48+mid*.34+high*.18;smBass+=(bass-smBass)*.18;smMid+=(mid-smMid)*.13;smHigh+=(high-smHigh)*.12;smEnergy+=(energy-smEnergy)*.15;uniforms.uBass.value=smBass;uniforms.uMid.value=smMid;uniforms.uHigh.value=smHigh;uniforms.uEnergy.value=smEnergy;level.style.width=`${Math.max(3,Math.min(100,smEnergy*135))}%`;if(!stream)readout.textContent=media.paused?'PAUSED':`${Math.round(smEnergy*100)}%`}else{uniforms.uBass.value=.04;uniforms.uMid.value=.035;uniforms.uHigh.value=.025;uniforms.uEnergy.value=.03}uniforms.uTime.value=t;rotX+=(targetX-rotX)*.075;rotY+=(targetY-rotY)*.075;root.rotation.x=rotX;root.rotation.y=rotY+t*.035;particles.rotation.z=Math.sin(t*.17)*.035;dust.rotation.y=t*.008;dust.rotation.x=t*.003;camera.position.z+=(zoom-camera.position.z)*.08;renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));uniforms.uPixelRatio.value=Math.min(devicePixelRatio,2)});
</script></body></html>
