r-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.35;pointer-events:none}.circle.mic.active{color:#effcff;background:#20292b}.circle.mic.active:after{opacity:1}#status{position:absolute;left:50%;bottom:13.4%;transform:translateX(-50%);font-size:10px;color:rgba(255,255,255,.3);white-space:nowrap;opacity:0;transition:.2s;max-width:80vw;overflow:hidden;text-overflow:ellipsis}#status.show{opacity:1}.version{position:fixed;right:max(10px,env(safe-area-inset-right));bottom:max(9px,env(safe-area-inset-bottom));z-index:8;font-size:9px;line-height:1;color:rgba(255,255,255,.24);letter-spacing:.06em;font-weight:500;pointer-events:none;user-select:none}@keyframes pulse{0%,100%{opacity:.68}50%{opacity:1}}</style></head><body><div id="stage"></div><input id="file" type="file" accept="video/*,audio/*"><video id="media" playsinline preload="metadata"></video><div class="ui"><button id="prompt" class="prompt">Say something...</button><div id="status"></div><div class="controls"><button id="close" class="circle close" aria-label="停止"><svg viewBox="0 0 24 24" fill="none"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button><button id="mic" class="circle mic" aria-label="マイク"><svg viewBox="0 0 24 24" fill="none"><rect x="8.2" y="3" width="7.6" height="12" rx="3.8" stroke="currentColor" stroke-width="1.7"/><path d="M5.5 11.5a6.5 6.5 0 0013 0M12 18v3M8.5 21h7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button></div></div><div class="version">v1.2.0</div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js';const $=id=>document.getElementById(id),stage=$('stage'),file=$('file'),media=$('media'),promptBtn=$('prompt'),micBtn=$('mic'),closeBtn=$('close'),status=$('status');const scene=new THREE.Scene();scene.background=new THREE.Color(0x111010);const camera=new THREE.PerspectiveCamera(44,innerWidth/innerHeight,.1,100);camera.position.z=8.8;const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x111010,1);stage.appendChild(renderer.domElement);const mobile=innerWidth<700,BASE_SCALE=mobile?.54:.74,root=new THREE.Group();root.position.y=.34;root.scale.setScalar(BASE_SCALE);scene.add(root);const R=1.52;root.add(new THREE.Mesh(new THREE.SphereGeometry(R*.992,48,32),new THREE.MeshBasicMaterial({color:0x111010,depthWrite:true,depthTest:true})));const u={uTime:{value:0},uBass:{value:0},uMid:{value:0},uHigh:{value:0},uEnergy:{value:0},uPixelRatio:{value:Math.min(devicePixelRatio,2)}},mat=new THREE.ShaderMaterial({uniforms:u,transparent:true,depthTest:true,depthWrite:false,vertexShader:`attribute vec3 aDir;attribute float aPhase;uniform float uTime,uBass,uMid,uHigh,uPixelRatio;void main(){vec3 n=normalize(aDir);float b=smoothstep(.025,.62,uBass),m=smoothstep(.018,.52,uMid),h=smoothstep(.012,.42,uHigh);float d=.06*pow(b,1.18)+.012*sin((n.x*5.+n.y*6.+n.z*4.)+uTime*2.+aPhase)*m+.005*sin((n.x*11.-n.y*8.+n.z*9.)+uTime*3.+aPhase)*h+.002*sin(uTime*.7+aPhase);vec4 mv=modelViewMatrix*vec4(n*(1.52+d),1.);float q=31./max(4.,-mv.z);gl_PointSize=(1.28+h*.12)*uPixelRatio*q;gl_Position=projectionMatrix*mv;}`,fragmentShader:`precision highp float;void main(){float d=length(gl_PointCoord-.5);if(d>=.49)discard;float a=1.-smoothstep(.22,.49,d);gl_FragColor=vec4(vec3(1.),a*.78);}`});const mask=atob('AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABgAAAAAAAAAAAAAAAAcAAAAAAAAAAAAAAAADAAAAAAAAAAAAIAAAA8AAAAAAAAAAACAAAAPAAAAAAAAMABAAAAAD4AABgAAMDxAQAAAAA/AAAeAADg/wAAAACAHwAAHwAA8H8AAAAAwD8AgJ8AAPgfAAAAAOA/AOBPAADwBwAAAAD4HwDwTwAAcAIAAAAA/h8A+AcAAGAAAAAAAP8PAPwDAAAEAQAAAMD/BwD+AQAIYAAAAADgfwCA3wAAMgQAAAAA4B8AwP8AABgAAAAAAPAHAPP/AIAIAAAAAAD0AMD//4ABAAAAAAAAAQDw/x9AwAAAAAAAYAAA+P83cDgAAAAAABYEAPz/fXg+AAAAAIBhAAD+/z58fwAAAADwIQAA/7/n/38AAAAA/AMAAP7//f8/AAAAAP4PAAA/4P//nwEAAID/DwAAHfz+/y8DAADg/wcAwEH///8fAQAA8L8FAID32P7/PwEAAPjPDwDA/////z8AAAD+/w8A0P////8/AACA/98PAIz+///3DwJA4P/hAwCA/P///w8DeP/9MCAAcPK///9/j/z//zo4GOD2//v//y/+/3IR/ADgr5////8PAPDZA/8BAEDo/48DAADg9MD/AACAAH/AAAAAANn+/wAOAAAEAAAAAADwlx8AAAAAAAAA'),dirs=[],ph=[];let k=0;for(let r=0;r<48;r++)for(let c=0;c<103;c++,k++){if(!(mask.charCodeAt(k>>3)&(1<<(k&7))))continue;const lat=(-82.25+r*3.5)*Math.PI/180,lon=(-178.25+c*3.5-138)*Math.PI/180,cl=Math.cos(lat);dirs.push(cl*Math.sin(lon),Math.sin(lat),cl*Math.cos(lon));ph.push(((r*103+c)*.61803398875%1)*Math.PI*2)}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(dirs.length),3));geo.setAttribute('aDir',new THREE.BufferAttribute(new Float32Array(dirs),3));geo.setAttribute('aPhase',new THREE.BufferAttribute(new Float32Array(ph),1));geo.boundingSphere=new THREE.Sphere(new THREE.Vector3(),2.1);root.add(new THREE.Points(geo,mat));let audioCtx,analyser,freq,mediaSource,currentSource,micStream,objectUrl,smBass=0,smMid=0,smHigh=0,smEnergy=0;function showStatus(t,ms=1600){status.textContent=t;status.classList.add('show');clearTimeout(showStatus.t);showStatus.t=setTimeout(()=>status.classList.remove('show'),ms)}function ensureAudio(){if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();analyser=audioCtx.createAnalyser();analyser.fftSize=1024;analyser.smoothingTimeConstant=.76;freq=new Uint8Array(analyser.frequencyBinCount)}if(audioCtx.state==='suspended')audioCtx.resume()}function disconnect(){try{currentSource?.disconnect()}catch{}currentSource=null;if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null}}function band(lo,hi){if(!analyser)return 0;const ny=audioCtx.sampleRate/2,a=Math.floor(lo/ny*freq.length),b=Math.min(freq.length-1,Math.ceil(hi/ny*freq.length));let s=0,n=0;for(let i=a;i<=b;i++){s+=freq[i];n++}return n?s/n/255:0}function connectMedia(){ensureAudio();disconnect();if(!mediaSource)mediaSource=audioCtx.createMediaElementSource(media);currentSource=mediaSource;mediaSource.connect(analyser);mediaSource.connect(audioCtx.destination)}async function startMic(){try{ensureAudio();disconnect();media.pause();micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});currentSource=audioCtx.createMediaStreamSource(micStream);currentSource.connect(analyser);micBtn.classList.add('active');promptBtn.classList.add('listening');promptBtn.textContent='Listening...';showStatus('Microphone active')}catch{showStatus('マイクを利用できません',2300)}}function stopAll(clear=false){disconnect();media.pause();micBtn.classList.remove('active');promptBtn.classList.remove('listening');promptBtn.textContent='Say something...';smBass=smMid=smHigh=smEnergy=0;if(clear){media.removeAttribute('src');media.load();if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null}}}function loadFile(f){if(!f)return;stopAll(true);ensureAudio();objectUrl=URL.createObjectURL(f);media.src=objectUrl;media.load();connectMedia();promptBtn.textContent='Listening...';promptBtn.classList.add('listening');showStatus(f.name,2200);media.play().catch(()=>{promptBtn.textContent='Tap to play';promptBtn.classList.remove('listening')})}promptBtn.onclick=()=>{if(media.src&&media.paused&&!micStream){ensureAudio();media.play();promptBtn.textContent='Listening...';promptBtn.classList.add('listening')}else file.click()};file.onchange=()=>loadFile(file.files?.[0]);micBtn.onclick=()=>micStream?stopAll():startMic();closeBtn.onclick=()=>stopAll(true);media.onended=()=>{promptBtn.textContent='Say something...';promptBtn.classList.remove('listening')};let drag=false,lx=0,ly=0,tx=-.1,ty=0,rx=-.1,ry=0;renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY});renderer.domElement.addEventListener('pointermove
