<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111010">
<title>Voice Particle Earth</title>
<style>
:root{color-scheme:dark;--bg:#111010}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg)}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;color:#eee;-webkit-tap-highlight-color:transparent;touch-action:none;background:radial-gradient(circle at 50% 39%,rgba(255,255,255,.018),transparent 27%),#111010}#stage{position:fixed;inset:0;z-index:1}canvas{display:block;width:100%;height:100%}#file,#media{display:none}.ui{position:fixed;inset:0;z-index:5;pointer-events:none}.prompt{position:absolute;left:50%;bottom:17.2%;transform:translateX(-50%);pointer-events:auto;border:0;padding:12px 20px;background:linear-gradient(90deg,#5fe5f2,#72c4ff 44%,#a985ff 76%,#dd8bff);-webkit-background-clip:text;background-clip:text;color:transparent;font:600 clamp(17px,4.5vw,21px)/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-.025em;white-space:nowrap;cursor:pointer}.prompt.listening{animation:pulse 1.7s ease-in-out infinite}.controls{position:absolute;left:50%;bottom:max(4.5%,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:34px;pointer-events:auto}.circle{position:relative;width:58px;height:58px;border-radius:50%;border:1px solid rgba(255,255,255,.045);background:rgba(38,37,37,.95);display:grid;place-items:center;color:#d8d8d8;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.025);transition:transform .14s ease,background .2s ease,color .2s ease}.circle:active{transform:scale(.93)}.circle svg{width:23px;height:23px}.circle.close svg{width:22px;height:22px}.circle.mic:after{content:"";position:absolute;inset:-1px;border-radius:50%;padding:1px;background:linear-gradient(135deg,rgba(74,231,241,.42),rgba(111,142,255,.20) 46%,rgba(206,107,255,.42));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.35;pointer-events:none}.circle.mic.active{color:#effcff;background:#20292b}.circle.mic.active:after{opacity:1}#status{position:absolute;left:50%;bottom:13.4%;transform:translateX(-50%);font-size:10px;color:rgba(255,255,255,.3);white-space:nowrap;opacity:0;transition:.2s;max-width:80vw;overflow:hidden;text-overflow:ellipsis}#status.show{opacity:1}.version{position:fixed;right:max(10px,env(safe-area-inset-right));bottom:max(9px,env(safe-area-inset-bottom));z-index:8;font-size:9px;line-height:1;color:rgba(255,255,255,.24);letter-spacing:.06em;font-weight:500;pointer-events:none;user-select:none}@keyframes pulse{0%,100%{opacity:.68}50%{opacity:1}}
</style>
</head>
<body>
<div id="stage"><canvas id="globe"></canvas></div><input id="file" type="file" accept="video/*,audio/*"><video id="media" playsinline preload="metadata"></video>
<div class="ui"><button id="prompt" class="prompt">Say something...</button><div id="status"></div><div class="controls"><button id="close" class="circle close" aria-label="停止"><svg viewBox="0 0 24 24" fill="none"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button><button id="mic" class="circle mic" aria-label="マイク"><svg viewBox="0 0 24 24" fill="none"><rect x="8.2" y="3" width="7.6" height="12" rx="3.8" stroke="currentColor" stroke-width="1.7"/><path d="M5.5 11.5a6.5 6.5 0 0013 0M12 18v3M8.5 21h7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button></div></div>
<div class="version">v1.3.0</div>
<script>
const $=id=>document.getElementById(id),canvas=$('globe'),ctx=canvas.getContext('2d',{alpha:false}),file=$('file'),media=$('media'),promptBtn=$('prompt'),micBtn=$('mic'),closeBtn=$('close'),status=$('status');
const MAP_W=180,MAP_H=90,MAP_B64='AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAIAPgM0BAAAAAAAAAAAAAAAAAAAAAADM+/z//wcAAAAABAACAAAAAAAAAAAAhPf4//8PAPAAAAAAwAIAAAAAAAAAwADEw////wEABAAAAADgAAAAAAAAAABQQT8A/v8PAAAAAAwA/D8AOAEAAAAAcBNtD8D/XwAAAAAgAPz/PwcAABCAAQD4w/oH8P8FAAAAAIJ7//9//xOAAP/ff2479QD/HwAA+A8EN/7////////g/////x88+B8AAOD/1//7////////jP//3/+/uAE/wAcAn9f//////////w/w////9wEo4AEAAHz2////////////AL/+//4HeAAcAADA5/3/////////9ADgAf7/f4AnAAAAAGb8////////H8AAAAhA//8f8AcAAIAB4////////38ABwAAAPD//Z/9AQAAFAT+v////+//A3AAAAAA/n//+z8AAGDj//////9///8CAQAAAMD/////AgAA8P//////////LwAAAAAA6P/7/2IAAAD+//////////8AAAAAAAD///I/CAAA4P//ff//////JwAAAAAA8P+//AYAAAD+/ulz/v///z8AAAAAAAD///sHAAAA/pgPOP//////MQAAAAAA8P//HwAAAMBD9v7n/////wcAAAAAAAD///8AAAAAPkT6P/7///8hEAAAAAAA4P//DwAAAIDBAv/n////f8YAAAAAAAD8//8AAAAA+AdE//////8jDwAAAAAAgP//AwAAAMD/APD/////PxgAAAAAAADw/x8AAAAA/n/v//////8HAAAAAAAAAPwDAgAAAOD///v7////fwAAAAAAAACgHwAAAACA//9/f/7///8DAAAAAAAAAPQBAAAAAPj//+cP+P//PwAAAAAAAAAAHjAAAADA/////g////8EAAAAAAAAAOBhCAAAAPz//99/4B//AAAAAAAAAAAAPAMMAADA////+Qf44BcAAAAAAAAAAAA/AAAAAPz9/78/gAf6QAAAAAAAAAAAAA8AAADg////ewA4gA8EAAAAAAAAAADAAAAAAPz//X8BgAP4QQAAAAAAAAAAAAgOAADA////zwAwgAwQAAAAAAAAAAAA9Q8AAPj///8HAAFIAAAAAAAAAAAAAID/AQAA////fwBAAAAQAAAAAAAAAAAA+P8AAGDg//8DAAA0GAAAAAAAAAAAAID/HwAAAPj/HwAAgMIBAAAAAAAAAAAA/P8BAACA//8AAAAYXwAAAAAAAAAAAMD/fwAAAPy/BwAAAOOBAQAAAAAAAAAA/P8/AACA/z8AAABgKtQBAAAAAAAAAOD//w8AAPD/AwAAAAQAeAAAAAAAAAAA/P//AQAA/z8AAACAB4AHAQAAAAAAAID//w8AAOD/AwAAAAARsEAAAAAAAAAA+P9/AAAA/j8AAAAAAAAAAAAAAAAAAAD//wcAAPD/QwAAAACAIwAAAAAAAAAA8P9/AAAA/z8EAAAAAD4GIAAAAAAAAAD8/wMAAPD/cwAAAAD4fwAAAAAAAAAAgP4/AAAA/w8HAAAAgP8HAAAAAAAAAAD4/wMAAOD/MAAAAAD//wEBAAAAAAAAgP8PAAAA/g8DAAAA+P8fAAAAAAAAAAD4PwAAAOB/MAAAAID//wMAAAAAAAAAgP8DAAAA/AMAAAAA+P9/AAAAAAAAAAD8HwAAAMA/AAAAAID//wcAAAAAAAAAwP8AAAAA+AEAAAAA8P9/AAAAAAAAAAD8DwAAAIAPAAAAAAAP/gMAAAAAAAAAwB8AAAAAAAAAAAAAEMAfAAAAAAAAAAD+AwAAAAAAAAAAAAAA8AEgAAAAAAAA4AcAAAAAAAAAAAAAAAAAAAYAAAAAAABeAAAAAAAAAAAAAAAAwAAwAAAAAAAAwAMAAAAAAAAAAAAAAAAIgAEAAAAAAAAeAAAAAAAAAAAAAAAAAAAMAAAAAAAA4AEAAAAAAAAAAAAAAAAAAAAAAAAAAAAOAAAAAAAAAAABAAAAAAAAAAAAAAAAYAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAOAAAAAAAAAAAAAAAAAAAAAAAAAAAAgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA';
const bytes=Uint8Array.from(atob(MAP_B64),c=>c.charCodeAt(0)),points=[];for(let y=0;y<MAP_H;y++){const lat=(89-(178*y/(MAP_H-1)))*Math.PI/180,cl=Math.cos(lat),sl=Math.sin(lat);for(let x=0;x<MAP_W;x++){const i=y*MAP_W+x;if(!((bytes[i>>3]>>(i&7))&1))continue;const lon=(-179+(358*x/(MAP_W-1)))*Math.PI/180,rel=lon-138*Math.PI/180;points.push({x:cl*Math.sin(rel),y:sl,z:cl*Math.cos(rel),p:((i*.61803398875)%1)*6.283,r:((i*37)%101)/101})}}
let W=0,H=0,DPR=1;function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
let yaw=0,pitch=-.10,drag=false,lx=0,ly=0,last=performance.now(),auto=true;canvas.addEventListener('pointerdown',e=>{drag=true;auto=false;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture?.(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-lx)*.006;pitch+=(e.clientY-ly)*.006;pitch=Math.max(-1.05,Math.min(1.05,pitch));lx=e.clientX;ly=e.clientY});canvas.addEventListener('pointerup',()=>{drag=false;setTimeout(()=>auto=true,1200)});canvas.addEventListener('pointercancel',()=>drag=false);
let audioCtx,analyser,freq,mediaSource,currentSource,micStream,objectUrl,smBass=0,smMid=0,smHigh=0,smEnergy=0;function showStatus(t,ms=1600){status.textContent=t;status.classList.add('show');clearTimeout(showStatus.t);showStatus.t=setTimeout(()=>status.classList.remove('show'),ms)}function ensureAudio(){if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();analyser=audioCtx.createAnalyser();analyser.fftSize=1024;analyser.smoothingTimeConstant=.76;freq=new Uint8Array(analyser.frequencyBinCount)}if(audioCtx.state==='suspended')audioCtx.resume()}function disconnect(){try{currentSource?.disconnect()}catch{}currentSource=null;if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null}}function band(lo,hi){if(!analyser)return 0;const ny=audioCtx.sampleRate/2,a=Math.floor(lo/ny*freq.length),b=Math.min(freq.length-1,Math.ceil(hi/ny*freq.length));let s=0,n=0;for(let i=a;i<=b;i++){s+=freq[i];n++}return n?s/n/255:0}function connectMedia(){ensureAudio();disconnect();if(!mediaSource)mediaSource=audioCtx.createMediaElementSource(media);currentSource=mediaSource;mediaSource.connect(analyser);mediaSource.connect(audioCtx.destination)}async function startMic(){try{ensureAudio();disconnect();media.pause();micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});currentSource=audioCtx.createMediaStreamSource(micStream);currentSource.connect(analyser);micBtn.classList.add('active');promptBtn.classList.add('listening');promptBtn.textContent='Listening...';showStatus('Microphone active')}catch{showStatus('マイクを利用できません',2300)}}function stopAll(clear=false){disconnect();media.pause();micBtn.classList.remove('active');promptBtn.classList.remove('listening');promptBtn.textContent='Say something...';smBass=smMid=smHigh=smEnergy=0;if(clear){media.removeAttribute('src');media.load();if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null}}}function loadFile(f){if(!f)return;stopAll(true);ensureAudio();objectUrl=URL.createObjectURL(f);media.src=objectUrl;media.load();connectMedia();promptBtn.textContent='Listening...';promptBtn.classList.add('listening');showStatus(f.name,2200);media.play().catch(()=>{promptBtn.textContent='Tap to play';promptBtn.classList.remove('listening')})}promptBtn.onclick=()=>{if(media.src&&media.paused&&!micStream){ensureAudio();media.play();promptBtn.textContent='Listening...';promptBtn.classList.add('listening')}else file.click()};file.onchange=()=>loadFile(file.files?.[0]);micBtn.onclick=()=>micStream?stopAll():startMic();closeBtn.onclick=()=>stopAll(true);media.onended=()=>{promptBtn.textContent='Say something...';promptBtn.classList.remove('listening')};
function render(now){requestAnimationFrame(render);const dt=Math.min(.04,(now-last)/1000);last=now;if(auto&&!drag)yaw+=dt*.18;if(analyser&&currentSource){analyser.getByteFrequencyData(freq);const b=band(35,190),m=band(190,2200),h=band(2200,12000),e=b*.50+m*.34+h*.16;smBass+=(b-smBass)*.18;smMid+=(m-smMid)*.13;smHigh+=(h-smHigh)*.14;smEnergy+=(e-smEnergy)*.15}else{smBass+=(.006-smBass)*.03;smMid+=(.005-smMid)*.03;smHigh+=(.004-smHigh)*.03;smEnergy+=(.004-smEnergy)*.03}ctx.fillStyle='#111010';ctx.fillRect(0,0,W,H);const mobile=W<700,R=Math.min(W*(mobile?.225:.19),H*(mobile?.128:.17)),cx=W*.5,cy=H*(mobile?.39:.42),cyaw=Math.cos(yaw),syaw=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),basePulse=1+Math.min(smBass,.8)*.045;for(const q of points){let x=q.x*cyaw+q.z*syaw,z=-q.x*syaw+q.z*cyaw,y=q.y;const y2=y*cp-z*sp,z2=y*sp+z*cp;if(z2<=.02)continue;const local=1+Math.sin(now*.002+q.p+x*7+y2*8)*smMid*.015+Math.sin(now*.003+q.p*1.7)*smHigh*.006,rr=R*basePulse*local,px=cx+x*rr,py=cy-y2*rr,depth=Math.min(1,Math.max(0,z2)),rad=(mobile?.68:.78)+depth*(mobile?.62:.84)+q.r*.15,alpha=.22+depth*.72;ctx.beginPath();ctx.fillStyle='rgba(255,255,255,'+alpha.toFixed(3)+')';ctx.arc(px,py,rad,0,6.283);ctx.fill()}}requestAnimationFrame(render);
</script>
</body>
</html>
