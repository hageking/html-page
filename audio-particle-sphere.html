</style></head><body><div id="stage"><canvas id="globe" tabindex="0" role="button" aria-label="粒子球と地球儀を切り替え"></canvas></div><input id="file" type="file" accept="video/*,audio/*"><video id="media" playsinline preload="metadata"></video><div class="ui"><button id="prompt" class="prompt">Say something...</button><div id="status"></div><div class="controls"><button id="close" class="circle close" aria-label="停止"><svg viewBox="0 0 24 24" fill="none"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button><button id="mic" class="circle mic" aria-label="マイク"><svg viewBox="0 0 24 24" fill="none"><rect x="8.2" y="3" width="7.6" height="12" rx="3.8" stroke="currentColor" stroke-width="1.7"/><path d="M5.5 11.5a6.5 6.5 0 0013 0M12 18v3M8.5 21h7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button></div></div><div class="version">v1.5.0</div><script>
const $=id=>document.getElementById(id),canvas=$('globe'),ctx=canvas.getContext('2d',{alpha:false}),file=$('file'),media=$('media'),promptBtn=$('prompt'),micBtn=$('mic'),closeBtn=$('close'),status=$('status');
const RAD=Math.PI/180,MAP_W=103,MAP_H=48,MAP_B64='AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABgAAAAAAAAAAAAAAAAcAAAAAAAAAAAAAAAADAAAAAAAAAAAAIAAAA8AAAAAAAAAAACAAAAPAAAAAAAAMABAAAAAD4AABgAAMDxAQAAAAA/AAAeAADg/wAAAACAHwAAHwAA8H8AAAAAwD8AgJ8AAPgfAAAAAOA/AOBPAADwBwAAAAD4HwDwTwAAcAIAAAAA/h8A+AcAAGAAAAAAAP8PAPwDAAAEAQAAAMD/BwD+AQAIYAAAAADgfwCA3wAAMgQAAAAA4B8AwP8AABgAAAAAAPAHAPP/AIAIAAAAAAD0AMD//4ABAAAAAAAAAQDw/x9AwAAAAAAAYAAA+P83cDgAAAAAABYEAPz/fXg+AAAAAIBhAAD+/z58fwAAAADwIQAA/7/n/38AAAAA/AMAAP7//f8/AAAAAP4PAAA/4P//nwEAAID/DwAAHfz+/y8DAADg/wcAwEH///8fAQAA8L8FAID32P7/PwEAAPjPDwDA/////z8AAAD+/w8A0P////8/AACA/98PAIz+///3DwJA4P/hAwCA/P///w8DeP/9MCAAcPK///9/j/z//zo4GOD2//v//y/+/3IR/ADgr5////8PAPDZA/8BAEDo/48DAADg9MD/AACAAH/AAAAAANn+/wAOAAAEAAAAAADwlx8AAAAAAAAA',bytes=Uint8Array.from(atob(MAP_B64),c=>c.charCodeAt(0)),pts=[];let k=0;for(let r=0;r<MAP_H;r++)for(let c=0;c<MAP_W;c++,k++){if(!((bytes[k>>3]>>(k&7))&1))continue;const lat=(-82.25+r*3.5)*RAD,lon=(-178.25+c*3.5)*RAD,cl=Math.cos(lat),rel=lon-138*RAD;pts.push({ex:cl*Math.sin(rel),ey:Math.sin(lat),ez:cl*Math.cos(rel),p:((k*.61803398875)%1)*6.28318530718,r:((k*37)%101)/101})}
const N=pts.length,G=Math.PI*(3-Math.sqrt(5));for(let i=0;i<N;i++){const sy=1-2*(i+.5)/N,sr=Math.sqrt(Math.max(0,1-sy*sy)),a=i*G;pts[i].sx=sr*Math.cos(a);pts[i].sy=sy;pts[i].sz=sr*Math.sin(a)}
let W=0,H=0,DPR=1,hitCx=0,hitCy=0,hitR=1;function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
let yaw=0,pitch=-.10,yawVel=0,pitchVel=0,drag=false,lx=0,ly=0,downX=0,downY=0,moved=false,last=performance.now(),auto=true;let mode='sphere',morph=0,morphFrom=0,morphTo=0,morphStart=0,transitionWave=0;const MORPH_MS=1350;const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function showStatus(t,ms=1300){status.textContent=t;status.classList.add('show');clearTimeout(showStatus.t);showStatus.t=setTimeout(()=>status.classList.remove('show'),ms)}
function setMode(next){mode=next;morphFrom=morph;morphTo=next==='earth'?1:0;morphStart=performance.now();if(next==='earth'){requestLiveLocation();showStatus('Earth mode')}else showStatus('Particle mode')}function toggleMode(){setMode(mode==='sphere'?'earth':'sphere')}
canvas.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleMode()}});canvas.addEventListener('pointerdown',e=>{drag=true;moved=false;downX=lx=e.clientX;downY=ly=e.clientY;auto=false;yawVel=pitchVel=0;canvas.setPointerCapture?.(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-lx,dy=e.clientY-ly;if(Math.hypot(e.clientX-downX,e.clientY-downY)>7)moved=true;if(moved){yaw+=dx*.0065;pitch+=dy*.0065;yawVel=dx*.0065;pitchVel=dy*.0065}lx=e.clientX;ly=e.clientY});function endPointer(e){if(!drag)return;drag=false;const inside=Math.hypot((e?.clientX??downX)-hitCx,(e?.clientY??downY)-hitCy)<=hitR*1.18;if(!moved&&inside){yawVel=pitchVel=0;toggleMode()}setTimeout(()=>auto=true,1200)}canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',()=>{drag=false;setTimeout(()=>auto=true,1200)});
let locLat=34.7931,locLon=135.4878,locRequested=false;function locVector(lat,lon){const la=lat*RAD,cl=Math.cos(la),rel=(lon-138)*RAD;return{x:cl*Math.sin(rel),y:Math.sin(la),z:cl*Math.cos(rel)}}let loc=locVector(locLat,locLon);function requestLiveLocation(){if(locRequested||!navigator.geolocation)return;locRequested=true;navigator.geolocation.getCurrentPosition(p=>{locLat=p.coords.latitude;locLon=p.coords.longitude;loc=locVector(locLat,locLon);showStatus('Location updated',1000)},()=>{},{enableHighAccuracy:true,timeout:6500,maximumAge:30000})}
let audioCtx,analyser,freq,mediaSource,currentSource,micStream,objectUrl,smBass=0,smMid=0,smHigh=0,smEnergy=0;function ensureAudio(){if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();analyser=audioCtx.createAnalyser();analyser.fftSize=1024;analyser.smoothingTimeConstant=.68;freq=new Uint8Array(analyser.frequencyBinCount)}if(audioCtx.state==='suspended')audioCtx.resume()}function disconnect(){try{currentSource?.disconnect()}catch{}currentSource=null;if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null}}function band(lo,hi){if(!analyser)return 0;const ny=audioCtx.sampleRate/2,a=Math.floor(lo/ny*freq.length),b=Math.min(freq.length-1,Math.ceil(hi/ny*freq.length));let s=0,n=0;for(let i=a;i<=b;i++){s+=freq[i];n++}return n?s/n/255:0}function connectMedia(){ensureAudio();disconnect();if(!mediaSource)mediaSource=audioCtx.createMediaElementSource(media);currentSource=mediaSource;mediaSource.connect(analyser);mediaSource.connect(audioCtx.destination)}async function startMic(){try{ensureAudio();disconnect();media.pause();micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});currentSource=audioCtx.createMediaStreamSource(micStream);currentSource.connect(analyser);micBtn.classList.add('active');promptBtn.classList.add('listening');promptBtn.textContent='Listening...';showStatus('Microphone active')}catch{showStatus('マイクを利用できません',2300)}}function stopAll(clear=false){disconnect();media.pause();micBtn.classList.remove('active');promptBtn.classList.remove('listening');promptBtn.textContent='Say something...';smBass=smMid=smHigh=smEnergy=0;if(clear){media.removeAttribute('src');media.load();if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null}}}function loadFile(f){if(!f)return;stopAll(true);ensureAudio();objectUrl=URL.createObjectURL(f);media.src=objectUrl;media.load();connectMedia();promptBtn.textContent='Listening...';promptBtn.classList.add('listening');sh function rot(vx,vy,vz,cyaw,syaw,cp,sp){const x=vx*cyaw+vz*syaw,z=-vx*syaw+vz*cyaw,y=vy;return[x,y*cp-z*sp,y*sp+z*cp]}
function render(now){requestAnimationFrame(render);const dt=Math.min(.04,(now-last)/1000);last=now;if(!drag){yaw+=yawVel*(dt*60);pitch+=pitchVel*(dt*60);const decay=Math.pow(.90,dt*60);yawVel*=decay;pitchVel*=decay;if(auto)yaw+=dt*(mode==='earth'?.16:.08)}if(Math.abs(yaw)>Math.PI*4)yaw%=Math.PI*2;if(Math.abs(pitch)>Math.PI*4)pitch%=Math.PI*2;if(morph!==morphTo){const u=Math.min(1,(now-morphStart)/MORPH_MS);morph=morphFrom+(morphTo-morphFrom)*ease(u);transitionWave=Math.sin(Math.PI*u);if(u>=1){morph=morphTo;transitionWave=0}}else transitionWave=0;if(analyser&&currentSource){analyser.getByteFrequencyData(freq);const b=band(35,190),m=band(190,2200),h=band(2200,12000),e=b*.50+m*.34+h*.16;smBass+=(b-smBass)*.24;smMid+=(m-smMid)*.22;smHigh+=(h-smHigh)*.26;smEnergy+=(e-smEnergy)*.20}else{smBass+=(.006-smBass)*.03;smMid+=(.005-smMid)*.03;smHigh+=(.004-smHigh)*.03;smEnergy+=(.004-smEnergy)*.03}ctx.fillStyle='#111010';ctx.fillRect(0,0,W,H);const mobile=W<700,R=Math.min(W*(mobile?.19:.17),H*(mobile?.11:.15)),cx=W*.5,cy=H*(mobile?.40:.43),cyaw=Math.cos(yaw),syaw=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);hitCx=cx;hitCy=cy;hitR=R;const one=1-morph;for(const q of pts){let vx=q.sx*one+q.ex*morph,vy=q.sy*one+q.ey*morph,vz=q.sz*one+q.ez*morph;const il=1/Math.max(.0001,Math.hypot(vx,vy,vz));vx*=il;vy*=il;vz*=il;const [x,y2,z2]=rot(vx,vy,vz,cyaw,syaw,cp,sp);if(z2<=.01)continue;const phase=now*.002+q.p+x*7+y2*8,liveBoost=micStream?1.65:1;const sphereAudio=liveBoost*(smBass*.105+Math.sin(phase)*smMid*.065+Math.sin(now*.005+q.p*1.7)*smHigh*.032),earthAudio=liveBoost*(smBass*.050+Math.sin(phase)*smMid*.018+Math.sin(now*.004+q.p)*smHigh*.009),audioScale=1+sphereAudio*one+earthAudio*morph,flight=1+transitionWave*(.045+.055*q.r),rr=R*audioScale*flight;let px=cx+x*rr,py=cy-y2*rr;const shake=liveBoost*(one*(smMid*4.8+smHigh*8.5)+morph*(smMid*1.4+smHigh*2.6))*(mobile?.72:1.0)*(q.r+.35);px+=Math.sin(now*.024+q.p*2.1)*shake;py+=Math.cos(now*.029+q.p*1.3)*shake;const depth=Math.min(1,Math.max(0,z2)),rad=(mobile?.60:.72)+depth*(mobile?.55:.76)+q.r*.12+one*smHigh*.28,alpha=.18+depth*.76;ctx.beginPath();ctx.fillStyle='rgba(255,255,255,'+alpha.toFixed(3)+')';ctx.arc(px,py,rad,0,6.283);ctx.fill()}
