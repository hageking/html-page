<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>全国チェーン売上推移</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f4f7ff;
      --muted: #97a4c4;
      --stage: #0b1020;
      --stage-2: #101a32;
      --line: rgba(185, 206, 255, .15);
      --cyan: #5ee7f2;
      --lime: #c6f36b;
      --pink: #ff81ba;
      --orange: #ffb86c;
      --violet: #bda3ff;
      --shadow: 0 24px 70px rgba(2, 7, 20, .35);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      padding: clamp(10px, 2vw, 24px);
      color: var(--ink);
      background: transparent;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    }

    button { font: inherit; }

    .sales-card {
      position: relative;
      width: min(100%, 980px);
      aspect-ratio: 16 / 10;
      min-height: min(92vh, 650px);
      margin: 0 auto;
      overflow: hidden;
      isolation: isolate;
      border: 1px solid rgba(199, 216, 255, .18);
      border-radius: 28px;
      background:
        radial-gradient(circle at 88% 0%, rgba(94, 231, 242, .12), transparent 30%),
        radial-gradient(circle at 0% 100%, rgba(198, 243, 107, .08), transparent 30%),
        linear-gradient(135deg, var(--stage), var(--stage-2));
      box-shadow: var(--shadow);
    }

    .sales-card::before {
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      content: "";
      opacity: .38;
      background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 24px 24px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }

    .card-inner { padding: clamp(22px, 4vw, 44px); }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 10px;
      color: var(--cyan);
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 14px var(--cyan);
      content: "";
    }

    .heading-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
    }

    h1 {
      max-width: 640px;
      margin: 0;
      font-size: clamp(1.55rem, 3.5vw, 2.7rem);
      line-height: 1.05;
      letter-spacing: -.05em;
    }

    .subtitle {
      margin: 11px 0 0;
      color: var(--muted);
      font-size: clamp(.85rem, 1.7vw, .98rem);
      line-height: 1.6;
    }

    .replay {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      padding: 0;
      border: 1px solid rgba(244, 247, 255, .2);
      border-radius: 50%;
      color: var(--ink);
      background: rgba(255,255,255,.06);
      cursor: pointer;
      transition: transform .2s ease, background .2s ease, border-color .2s ease;
    }

    .replay:hover, .replay:focus-visible { transform: rotate(-28deg); border-color: var(--cyan); background: rgba(94, 231, 242, .12); outline: none; }

    .replay svg { width: 19px; height: 19px; }

    .kpis {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 28px 0 22px;
    }

    .kpi {
      min-width: 0;
      padding: 15px 16px;
      border: 1px solid rgba(199, 216, 255, .13);
      border-radius: 17px;
      background: rgba(255,255,255,.045);
    }

    .kpi-label { display: block; margin-bottom: 7px; color: var(--muted); font-size: .75rem; }
    .kpi-value { display: block; overflow: hidden; color: var(--ink); font-size: clamp(1.05rem, 2.4vw, 1.55rem); font-weight: 800; letter-spacing: -.04em; text-overflow: ellipsis; white-space: nowrap; }
    .kpi-value.positive { color: var(--lime); }

    .chart-shell {
      position: relative;
      padding: clamp(7px, 1.4vw, 14px) clamp(7px, 1.4vw, 14px) 0;
      border: 1px solid rgba(199, 216, 255, .11);
      border-radius: 20px;
      background: rgba(4, 8, 20, .24);
    }

    #chart { display: block; width: 100%; height: auto; overflow: visible; }
    .grid-line { stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; }
    .axis-label, .month-label { fill: var(--muted); font-size: 12px; font-weight: 600; }
    .month-label { text-anchor: middle; }
    .axis-label { text-anchor: end; }
    .axis-line { stroke: rgba(244,247,255,.4); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
    .series-path { fill: none; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; filter: drop-shadow(0 0 7px currentColor); vector-effect: non-scaling-stroke; }
    .chart-point { opacity: 0; transform: scale(0); transform-box: fill-box; transform-origin: center; stroke: var(--stage); stroke-width: 2.3; vector-effect: non-scaling-stroke; }
    #chart.is-animating .series-path { animation: draw-line 1.55s cubic-bezier(.22,.61,.36,1) forwards; animation-delay: var(--delay); }
    #chart.is-animating .chart-point { animation: point-in .55s cubic-bezier(.16,1,.3,1) forwards; animation-delay: var(--point-delay); }
    .series-group.is-muted { opacity: .08; }
    .cursor-line { stroke: var(--cyan); stroke-width: 1.5; stroke-dasharray: 4 5; opacity: .78; vector-effect: non-scaling-stroke; }
    .cursor-dot { fill: var(--cyan); filter: drop-shadow(0 0 7px var(--cyan)); }

    @keyframes draw-line { to { stroke-dashoffset: 0; } }
    @keyframes point-in { 0% { opacity: 0; transform: scale(0); } 72% { opacity: 1; transform: scale(1.28); } 100% { opacity: 1; transform: scale(1); } }

    .tooltip {
      position: absolute;
      z-index: 3;
      min-width: 145px;
      padding: 10px 12px;
      border: 1px solid rgba(199,216,255,.22);
      border-radius: 12px;
      background: rgba(10, 16, 34, .94);
      box-shadow: 0 12px 32px rgba(0,0,0,.3);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -112%);
      transition: opacity .18s ease, left .18s ease, top .18s ease;
    }

    .tooltip.is-visible { opacity: 1; }
    .tooltip-month { margin-bottom: 5px; color: var(--ink); font-size: .73rem; font-weight: 800; }
    .tooltip-row { display: flex; align-items: center; justify-content: space-between; gap: 18px; color: var(--muted); font-size: .72rem; line-height: 1.55; }
    .tooltip-row strong { color: var(--ink); font-size: .76rem; }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 15px;
      margin: 17px 0 0;
    }

    .legend-button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 30px;
      padding: 3px 0;
      border: 0;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: .78rem;
      transition: color .2s ease, opacity .2s ease;
    }

    .legend-button:hover, .legend-button:focus-visible { color: var(--ink); outline: none; }
    .legend-button[aria-pressed="false"] { opacity: .42; text-decoration: line-through; text-decoration-color: currentColor; }
    .legend-swatch { width: 9px; height: 9px; border-radius: 3px; box-shadow: 0 0 9px currentColor; }

    .card-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 18px;
      color: var(--muted);
      font-size: .72rem;
      line-height: 1.5;
    }

    .card-foot span:last-child { color: rgba(244,247,255,.5); }

    @media (max-width: 560px) {
      body { padding: 7px; }
      .sales-card { min-height: 96vh; border-radius: 22px; }
      .card-inner { padding: 20px 15px 17px; }
      .heading-row { gap: 8px; }
      .kpis { gap: 7px; margin-top: 21px; }
      .kpi { padding: 11px 10px; border-radius: 13px; }
      .kpi-label { font-size: .65rem; }
      .kpi-value { font-size: .93rem; }
      .card-foot { align-items: flex-start; flex-direction: column; gap: 4px; }
      .legend { gap: 5px 10px; }
      .legend-button { font-size: .7rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <article class="sales-card" aria-labelledby="card-title">
    <div class="card-inner">
      <header>
        <p class="eyebrow">全国チェーン / 2026</p>
        <div class="heading-row">
          <div>
            <h1 id="card-title">全国チェーン売上推移</h1>
            <p class="subtitle">今年の月別売上を、動きのある折れ線で比較します。</p>
          </div>
          <button class="replay" id="replay" type="button" aria-label="アニメーションを再生">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 11a8 8 0 1 0 1 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M20 5v6h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </header>

      <section class="kpis" aria-label="概要指標">
        <div class="kpi"><span class="kpi-label">9月の合計</span><strong class="kpi-value" id="total-value">0億円</strong></div>
        <div class="kpi"><span class="kpi-label">前月比</span><strong class="kpi-value positive" id="change-value">+0.0%</strong></div>
        <div class="kpi"><span class="kpi-label">1月からの伸び</span><strong class="kpi-value" id="leader-value">―</strong></div>
      </section>

      <section class="chart-shell" id="chart-shell" aria-label="チェーン別の月間売上グラフ">
        <svg id="chart" viewBox="0 0 920 390" role="img" aria-labelledby="chart-title chart-desc">
          <title id="chart-title">2026年1月から9月のチェーン別売上推移</title>
          <desc id="chart-desc">マクドナルド、すき家、ガスト、くら寿司、吉野家の月別売上を比較したデモグラフです。</desc>
        </svg>
        <div class="tooltip" id="tooltip" aria-hidden="true"></div>
      </section>

      <nav class="legend" id="legend" aria-label="表示するチェーンを選択"></nav>
      <footer class="card-foot"><span>単位：億円 / 2026年1〜9月</span><span>※数値はデモデータです</span></footer>
    </div>
  </article>

  <script>
    (() => {
      const months = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月'];
      const series = [
        { id: 'mcd', name: 'マクドナルド', color: '#5ee7f2', values: [181, 176, 184, 191, 187, 198, 204, 201, 210] },
        { id: 'sukiya', name: 'すき家', color: '#c6f36b', values: [104, 107, 109, 112, 111, 116, 119, 121, 123] },
        { id: 'gusto', name: 'ガスト', color: '#ff81ba', values: [82, 85, 84, 88, 91, 94, 96, 99, 103] },
        { id: 'kurasushi', name: 'くら寿司', color: '#ffb86c', values: [67, 70, 73, 71, 76, 79, 83, 86, 89] },
        { id: 'yoshinoya', name: '吉野家', color: '#bda3ff', values: [58, 60, 61, 64, 63, 66, 68, 71, 74] }
      ];
      const svg = document.getElementById('chart');
      const legend = document.getElementById('legend');
      const tooltip = document.getElementById('tooltip');
      const chartShell = document.getElementById('chart-shell');
      const replay = document.getElementById('replay');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const view = { width: 920, height: 390, left: 55, right: 22, top: 25, bottom: 48 };
      const plot = { left: 55, right: 898, top: 25, bottom: 326 };
      const minValue = 40;
      const maxValue = 220;
      let activeMonth = 8;
      let activeSeries = new Set(series.map(item => item.id));
      let cursorTimer;

      const xAt = index => plot.left + index * ((plot.right - plot.left) / (months.length - 1));
      const yAt = value => plot.bottom - ((value - minValue) / (maxValue - minValue)) * (plot.bottom - plot.top);
      const make = (tag, attrs = {}) => {
        const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
        Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
        return node;
      };
      const pathFor = values => values.map((value, index) => `${index ? 'L' : 'M'} ${xAt(index).toFixed(2)} ${yAt(value).toFixed(2)}`).join(' ');

      function renderChart() {
        svg.querySelectorAll('.generated').forEach(node => node.remove());
        const background = make('g', { class: 'generated' });
        [40, 80, 120, 160, 200].forEach(value => {
          const y = yAt(value);
          background.appendChild(make('line', { class: 'grid-line', x1: plot.left, x2: plot.right, y1: y, y2: y }));
          const label = make('text', { class: 'axis-label', x: plot.left - 10, y: y + 4 });
          label.textContent = value;
          background.appendChild(label);
        });
        background.appendChild(make('line', { class: 'axis-line', x1: plot.left, x2: plot.right, y1: plot.bottom, y2: plot.bottom }));
        months.forEach((month, index) => {
          const label = make('text', { class: 'month-label', x: xAt(index), y: plot.bottom + 28 });
          label.textContent = month;
          background.appendChild(label);
        });
        svg.appendChild(background);

        const cursor = make('g', { class: 'generated cursor' });
        cursor.appendChild(make('line', { class: 'cursor-line', id: 'cursor-line', x1: xAt(activeMonth), x2: xAt(activeMonth), y1: plot.top, y2: plot.bottom }));
        cursor.appendChild(make('circle', { class: 'cursor-dot', id: 'cursor-dot', cx: xAt(activeMonth), cy: plot.top, r: 4 }));
        svg.appendChild(cursor);

        series.forEach((item, seriesIndex) => {
          const group = make('g', { class: `generated series-group ${activeSeries.has(item.id) ? '' : 'is-muted'}`, 'data-series-group': item.id });
          const path = make('path', { class: 'series-path', d: pathFor(item.values), pathLength: '1', stroke: item.color });
          path.style.setProperty('--delay', `${seriesIndex * 90}ms`);
          group.appendChild(path);
          item.values.forEach((value, index) => {
            const point = make('circle', { class: 'chart-point', cx: xAt(index), cy: yAt(value), r: index === item.values.length - 1 ? 5 : 4, fill: item.color });
            point.style.setProperty('--point-delay', `${500 + seriesIndex * 90 + index * 72}ms`);
            point.dataset.month = index;
            group.appendChild(point);
          });
          svg.appendChild(group);
        });
        updateCursor(activeMonth, false);
      }

      function renderLegend() {
        legend.innerHTML = '';
        series.forEach(item => {
          const button = document.createElement('button');
          button.className = 'legend-button';
          button.type = 'button';
          button.dataset.series = item.id;
          button.setAttribute('aria-pressed', String(activeSeries.has(item.id)));
          button.innerHTML = `<span class="legend-swatch" style="color:${item.color};background:${item.color}"></span>${item.name}`;
          button.addEventListener('click', () => {
            if (activeSeries.has(item.id)) activeSeries.delete(item.id); else activeSeries.add(item.id);
            button.setAttribute('aria-pressed', String(activeSeries.has(item.id)));
            document.querySelector(`[data-series-group="${item.id}"]`)?.classList.toggle('is-muted', !activeSeries.has(item.id));
          });
          legend.appendChild(button);
        });
      }

      function updateCursor(index, reveal = true) {
        activeMonth = Math.max(0, Math.min(months.length - 1, index));
        const line = document.getElementById('cursor-line');
        const dot = document.getElementById('cursor-dot');
        if (line) { line.setAttribute('x1', xAt(activeMonth)); line.setAttribute('x2', xAt(activeMonth)); }
        if (dot) { dot.setAttribute('cx', xAt(activeMonth)); dot.setAttribute('cy', plot.top); }
        const rows = series.filter(item => activeSeries.has(item.id)).map(item => `<div class="tooltip-row"><span>${item.name}</span><strong>${item.values[activeMonth]}億</strong></div>`).join('');
        tooltip.innerHTML = `<div class="tooltip-month">2026年${months[activeMonth]}</div>${rows || '<div class="tooltip-row">表示中の系列なし</div>'}`;
        tooltip.style.left = `${(xAt(activeMonth) / view.width) * 100}%`;
        tooltip.style.top = `${(yAt(160) / view.height) * 100}%`;
        if (reveal) { tooltip.classList.add('is-visible'); tooltip.setAttribute('aria-hidden', 'false'); }
      }

      function startCursor() {
        clearInterval(cursorTimer);
        if (reducedMotion) return;
        cursorTimer = setInterval(() => updateCursor((activeMonth + 1) % months.length, true), 1500);
      }

      function animateNumber(element, target, suffix = '', prefix = '') {
        if (reducedMotion) { element.textContent = `${prefix}${target}${suffix}`; return; }
        const duration = 900;
        const started = performance.now();
        const tick = now => {
          const progress = Math.min(1, (now - started) / duration);
          const eased = 1 - Math.pow(1 - progress, 3);
          element.textContent = `${prefix}${(target * eased).toFixed(suffix === '%' ? 1 : 0)}${suffix}`;
          if (progress < 1) requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      }

      function animateChart() {
        const total = series.reduce((sum, item) => sum + item.values[8], 0);
        const previous = series.reduce((sum, item) => sum + item.values[7], 0);
        const change = ((total - previous) / previous) * 100;
        const leader = series.reduce((best, item) => {
          const growth = item.values[8] - item.values[0];
          return growth > best.growth ? { name: item.name, growth } : best;
        }, { name: '', growth: -Infinity });
        animateNumber(document.getElementById('total-value'), total, '億円');
        animateNumber(document.getElementById('change-value'), change, '%', '+');
        document.getElementById('leader-value').textContent = reducedMotion ? leader.name : '―';
        if (!reducedMotion) setTimeout(() => { document.getElementById('leader-value').textContent = leader.name; }, 950);
        svg.classList.remove('is-animating');
        void svg.offsetWidth;
        svg.classList.add('is-animating');
        startCursor();
      }

      function playAgain() {
        activeMonth = 0;
        renderChart();
        renderLegend();
        animateChart();
        if (reducedMotion) updateCursor(8, true);
      }

      function nearestMonth(event) {
        const rect = svg.getBoundingClientRect();
        const raw = ((event.clientX - rect.left) / rect.width) * view.width;
        return Math.round((raw - plot.left) / ((plot.right - plot.left) / (months.length - 1)));
      }

      chartShell.addEventListener('pointermove', event => {
        updateCursor(nearestMonth(event), true);
      });
      chartShell.addEventListener('pointerleave', () => tooltip.classList.remove('is-visible'));
      replay.addEventListener('click', playAgain);
      renderLegend();
      playAgain();
    })();
  </script>
</body>
</html>
