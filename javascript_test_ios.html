<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>JavaScript動作確認</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #f5f7fb;
      color: #111827;
    }
    main {
      width: min(100%, 520px);
      padding: 28px;
      box-sizing: border-box;
      background: white;
      border-radius: 18px;
      box-shadow: 0 12px 32px rgba(0,0,0,.12);
    }
    h1 { margin-top: 0; }
    #status {
      padding: 16px;
      border-radius: 12px;
      background: #fff3cd;
      color: #664d03;
      font-weight: 700;
    }
    #status.success {
      background: #d1e7dd;
      color: #0f5132;
    }
    button {
      width: 100%;
      margin-top: 18px;
      min-height: 52px;
      border: 0;
      border-radius: 12px;
      background: #0a84ff;
      color: white;
      font: inherit;
      font-weight: 700;
    }
    #details {
      margin-top: 18px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main>
    <h1>JavaScript動作確認</h1>
    <p id="status">JavaScriptの実行を待っています…</p>
    <button id="testButton" type="button">ボタンを押して確認</button>
    <div id="details">
      <div>実行時刻: <span id="time">未実行</span></div>
      <div>クリック回数: <span id="count">0</span></div>
      <div>URL: <span id="url">確認中</span></div>
    </div>
  </main>

  <script>
    (function () {
      'use strict';

      const status = document.getElementById('status');
      const button = document.getElementById('testButton');
      const time = document.getElementById('time');
      const count = document.getElementById('count');
      const url = document.getElementById('url');
      let clicks = 0;

      time.textContent = new Date().toLocaleString('ja-JP');
      url.textContent = location.href;
      status.textContent = 'JavaScriptは正常に実行されています。';
      status.classList.add('success');

      button.addEventListener('click', function () {
        clicks += 1;
        count.textContent = String(clicks);
        status.textContent = 'ボタン操作も正常です。クリック回数: ' + clicks;
      });
    })();
  </script>
</body>
</html>
