<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#081321" />
  <title>水泳ラップ計算</title>
  <style>
    :root {
      --bg: #07111f;
      --card: rgba(255,255,255,.08);
      --card-2: rgba(255,255,255,.12);
      --line: rgba(255,255,255,.13);
      --text: #f4f9ff;
      --muted: #9fb1c7;
      --accent: #61d8ff;
      --accent-2: #8cf7c2;
      --danger: #ff8395;
      --radius: 22px;
      --shadow: 0 18px 50px rgba(0,0,0,.32);
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100svh;
      color: var(--text);
      background:
        radial-gradient(circle at 0 0, rgba(97,216,255,.24), transparent 19rem),
        linear-gradient(160deg, #07111f 0%, #0b1830 54%, #07111f 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-variant-numeric: tabular-nums;
      line-height: 1.45;
    }

    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

    .app {
      width: min(100% - 24px, 520px);
      margin: 0 auto;
      padding: calc(14px + env(safe-area-inset-top)) 0 calc(18px + env(safe-area-inset-bottom));
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      letter-spacing: -.04em;
      line-height: 1.1;
    }

    .count {
      color: #06111f;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-radius: 999px;
      padding: 7px 11px;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .panel { padding: 14px; }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .stat {
      min-width: 0;
      border-radius: 16px;
      padding: 10px;
      background: rgba(255,255,255,.075);
      border: 1px solid rgba(255,255,255,.09);
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .stat strong {
      display: block;
      overflow: hidden;
      font-size: 18px;
      line-height: 1.15;
      letter-spacing: -.03em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin-bottom: 10px;
    }

    .segmented button {
      min-height: 44px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 14px;
      color: var(--text);
      background: rgba(255,255,255,.07);
      font-weight: 900;
      cursor: pointer;
    }

    .segmented button.active {
      color: #06111f;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-color: transparent;
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr 82px;
      gap: 8px;
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      min-height: 62px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 17px;
      padding: 10px 14px;
      color: var(--text);
      background: rgba(255,255,255,.09);
      outline: none;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: .02em;
    }

    input::placeholder { color: rgba(244,249,255,.35); }

    input:focus {
      border-color: rgba(97,216,255,.78);
      box-shadow: 0 0 0 4px rgba(97,216,255,.13);
    }

    .btn {
      min-height: 52px;
      border: 0;
      border-radius: 16px;
      color: #06111f;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      font-weight: 950;
      cursor: pointer;
    }

    .btn.secondary {
      color: var(--text);
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.13);
    }

    .btn.danger {
      color: #27050b;
      background: linear-gradient(135deg, #ff9bab, var(--danger));
    }

    .btn:active,
    .keypad button:active,
    .segmented button:active { transform: translateY(1px) scale(.99); }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .keypad button {
      min-height: 56px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 16px;
      color: var(--text);
      background: rgba(255,255,255,.075);
      font-size: 20px;
      font-weight: 950;
      cursor: pointer;
    }

    .keypad .add-key {
      color: #06111f;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-color: transparent;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .results {
      margin-top: 12px;
      overflow: hidden;
    }

    .result-head {
      display: grid;
      grid-template-columns: 68px 1fr 1fr;
      gap: 8px;
      padding: 12px 14px 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    .rows { display: grid; }

    .row {
      display: grid;
      grid-template-columns: 68px 1fr 1fr;
      gap: 8px;
      align-items: center;
      padding: 13px 14px;
      border-top: 1px solid rgba(255,255,255,.09);
    }

    .distance {
      color: var(--muted);
      font-weight: 900;
    }

    .time {
      text-align: right;
      font-size: 19px;
      font-weight: 950;
      letter-spacing: -.02em;
    }

    .best { color: var(--accent-2); }

    .empty {
      padding: 24px 14px;
      color: var(--muted);
      text-align: center;
      border-top: 1px solid rgba(255,255,255,.09);
    }

    .toast {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom));
      z-index: 20;
      max-width: 520px;
      margin: 0 auto;
      padding: 13px 14px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 16px;
      color: var(--text);
      background: rgba(7,17,31,.95);
      box-shadow: var(--shadow);
      font-weight: 850;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: .16s ease;
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 370px) {
      .app { width: min(100% - 16px, 520px); }
      .stats { grid-template-columns: 1fr; }
      .stat { display: flex; justify-content: space-between; align-items: baseline; }
      .stat span { margin-bottom: 0; }
      .input-row { grid-template-columns: 1fr; }
      .result-head,
      .row { grid-template-columns: 58px 1fr 1fr; }
      .time { font-size: 17px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>水泳ラップ計算</h1>
      <div class="count" id="count">0本</div>
    </header>

    <section class="card panel">
      <div class="stats">
        <div class="stat"><span>合計</span><strong id="total">--</strong></div>
        <div class="stat"><span>平均</span><strong id="average">--</strong></div>
        <div class="stat"><span>最速</span><strong id="best">--</strong></div>
      </div>

      <div class="segmented" aria-label="区間距離">
        <button type="button" data-interval="25">25m</button>
        <button type="button" data-interval="50" class="active">50m</button>
        <button type="button" data-interval="100">100m</button>
        <button type="button" data-interval="200">200m</button>
      </div>

      <div class="input-row">
        <input id="timeInput" inputmode="none" autocomplete="off" placeholder="3012" aria-label="スプリットタイム" readonly />
        <button class="btn" id="addBtn" type="button">追加</button>
      </div>

      <div class="keypad" aria-label="数字入力">
        <button type="button" data-key="1">1</button>
        <button type="button" data-key="2">2</button>
        <button type="button" data-key="3">3</button>
        <button type="button" data-key="4">4</button>
        <button type="button" data-key="5">5</button>
        <button type="button" data-key="6">6</button>
        <button type="button" data-key="7">7</button>
        <button type="button" data-key="8">8</button>
        <button type="button" data-key="9">9</button>
        <button type="button" data-key=".">.</button>
        <button type="button" data-key="0">0</button>
        <button type="button" data-key="back">⌫</button>
        <button type="button" data-key=":">:</button>
        <button type="button" data-key="clear">C</button>
        <button type="button" class="add-key" data-key="enter">追加</button>
      </div>

      <div class="controls">
        <button class="btn secondary" id="undoBtn" type="button">戻す</button>
        <button class="btn danger" id="clearBtn" type="button">全消去</button>
      </div>
    </section>

    <section class="card results" aria-live="polite">
      <div class="result-head">
        <div>距離</div>
        <div style="text-align:right">通過</div>
        <div style="text-align:right">ラップ</div>
      </div>
      <div id="rows" class="rows">
        <div class="empty">スプリットを入力</div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status"></div>

  <script>
    const state = { interval: 50, splits: [] };
    const $ = (id) => document.getElementById(id);
    const els = {
      count: $('count'), total: $('total'), average: $('average'), best: $('best'),
      input: $('timeInput'), add: $('addBtn'), undo: $('undoBtn'), clear: $('clearBtn'),
      rows: $('rows'), toast: $('toast')
    };

    function normalize(value) {
      return String(value || '')
        .replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
        .replace(/：/g, ':')
        .replace(/[．。]/g, '.')
        .replace(/\s+/g, '')
        .trim();
    }

    function parseTime(raw) {
      const value = normalize(raw);
      if (!value) return null;

      if (/^\d+$/.test(value)) {
        const padded = value.padStart(3, '0');
        const cs = Number(padded.slice(-2));
        const sec = Number(padded.slice(-4, -2) || '0');
        const min = Number(padded.slice(0, -4) || '0');
        if (sec >= 60 || cs >= 100) return null;
        return Math.round((min * 60 + sec + cs / 100) * 100) / 100;
      }

      if (/^\d+(?::\d{1,2})?(?:\.\d{1,2})?$/.test(value)) {
        const parts = value.split(':');
        const seconds = parts.length === 1
          ? Number(parts[0])
          : Number(parts[0]) * 60 + Number(parts[1]);
        if (!Number.isFinite(seconds) || seconds < 0) return null;
        return Math.round(seconds * 100) / 100;
      }

      return null;
    }

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return '--';
      const sign = seconds < 0 ? '-' : '';
      let csTotal = Math.round(Math.abs(seconds) * 100);
      const cs = csTotal % 100;
      csTotal = Math.floor(csTotal / 100);
      const sec = csTotal % 60;
      const min = Math.floor(csTotal / 60);
      return `${sign}${min}:${String(sec).padStart(2, '0')}.${String(cs).padStart(2, '0')}`;
    }

    function laps() {
      return state.splits.map((split, i) => split - (state.splits[i - 1] || 0));
    }

    function save() {
      localStorage.setItem('swim-lap-mobile', JSON.stringify(state));
    }

    function load() {
      try {
        const data = JSON.parse(localStorage.getItem('swim-lap-mobile') || '{}');
        if ([25, 50, 100, 200].includes(Number(data.interval))) state.interval = Number(data.interval);
        if (Array.isArray(data.splits)) state.splits = data.splits.filter(Number.isFinite);
      } catch (_) {}
    }

    function toast(message) {
      els.toast.textContent = message;
      els.toast.classList.add('show');
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => els.toast.classList.remove('show'), 1400);
    }

    function render() {
      const lapValues = laps();
      const bestLap = lapValues.length ? Math.min(...lapValues) : null;
      const avgLap = lapValues.length ? lapValues.reduce((a, b) => a + b, 0) / lapValues.length : null;
      const total = state.splits.at(-1);

      els.count.textContent = `${state.splits.length}本`;
      els.total.textContent = total == null ? '--' : formatTime(total);
      els.average.textContent = avgLap == null ? '--' : formatTime(avgLap);
      els.best.textContent = bestLap == null ? '--' : formatTime(bestLap);

      document.querySelectorAll('[data-interval]').forEach(button => {
        button.classList.toggle('active', Number(button.dataset.interval) === state.interval);
      });

      if (!state.splits.length) {
        els.rows.innerHTML = '<div class="empty">スプリットを入力</div>';
        save();
        return;
      }

      els.rows.innerHTML = state.splits.map((split, i) => {
        const lap = lapValues[i];
        const isBest = lap === bestLap;
        return `
          <div class="row">
            <div class="distance">${state.interval * (i + 1)}m</div>
            <div class="time">${formatTime(split)}</div>
            <div class="time ${isBest ? 'best' : ''}">${formatTime(lap)}</div>
          </div>`;
      }).join('');
      save();
    }

    function addSplit() {
      const seconds = parseTime(els.input.value);
      if (seconds == null) return toast('入力を確認');
      const last = state.splits.at(-1);
      if (last != null && seconds <= last) return toast('前回より大きいタイムを入力');
      state.splits.push(seconds);
      els.input.value = '';
      render();
    }

    els.add.addEventListener('click', addSplit);
    els.input.addEventListener('keydown', event => {
      if (event.key === 'Enter') addSplit();
    });

    els.undo.addEventListener('click', () => {
      state.splits.pop();
      render();
    });

    els.clear.addEventListener('click', () => {
      state.splits = [];
      render();
    });

    document.querySelectorAll('[data-interval]').forEach(button => {
      button.addEventListener('click', () => {
        state.interval = Number(button.dataset.interval);
        render();
      });
    });

    document.querySelectorAll('[data-key]').forEach(button => {
      button.addEventListener('pointerdown', event => event.preventDefault());
      button.addEventListener('click', () => {
        const key = button.dataset.key;
        if (key === 'enter') return addSplit();
        if (key === 'back') els.input.value = els.input.value.slice(0, -1);
        else if (key === 'clear') els.input.value = '';
        else els.input.value += key;
      });
    });

    load();
    render();
  </script>
</body>
</html>
