<!-- The live 2019 BFS demo uses the legacy 1200×675 / 30fps scene geometry. -->
<script>
canvasWidth = 1200;
canvasHeight = 675;
cvw = 1200;
cvh = 675;
fr = 30;
</script>
</head>
<body>
<div id="canvas-wrap"></div>
<script>
// DFS implemented on the same Manim.js Graph_U/Tracer stack as Jazon Jiao's graph demos.

let EU_DFS = [
  [0,1],[0,2],[0,3],[0,4],[0,6],
  [1,2],[1,5],[1,6],[1,8,54],
  [2,3],[2,5],[2,6],[2,7],[2,8],
  [3,4],[3,5],[3,6],[3,7],[3,9],
  [4,6],[4,7],[4,9,-54],
  [5,6],[5,8],[5,9],[5,10],
  [6,7],[6,8],[6,9],[6,11],[6,13],
  [7,8],[7,9],[7,12],
  [8,9],[8,10],[8,11],[8,12],[8,13,54],[8,14],
  [9,10],[9,11],[9,12],[9,15],[9,16,-54],
  [10,11],[10,13],[10,14],[10,15],
  [11,12],[11,13],[11,14],[11,15],[11,16],
  [12,14],[12,15],[12,16],
  [13,14],[14,15],[15,16]
];

let G_DFS = {
  V: [
    [300,77],
    [120,177],[240,177],[360,177],[480,177],
    [180,277],[300,277],[420,277],
    [240,377],[360,377],
    [180,477],[300,477],[420,477],
    [120,577],[240,577],[360,577],[480,577]
  ],
  E: randomizeEdges(EU_DFS,0.67)
};

class Graph_DFS_Demo extends Graph_U {
  constructor(ctx,args){
    super(ctx,args);

    this.visited=[];
    for(let i=0;i<this.n;i++){
      this.nodes[i].txt.str=" ";
      this.visited[i]=i===0;
    }

    this.stack=[0];
    this.aim=[1];
    this.top=0;

    this.z=new Tracer(this.s,{
      str:"Depth-first search",
      x:637,y:77,start:args.time,begin:args.begin
    });
    this.z.add("DFS(start vertex)",0,35,45,false,false,17);
    this.z.add("End",4,0,90);
    this.z.add("DFS(v):",-1,0,175,false,Yellow);
    this.z.add("Mark v as visited",1,35,220);
    this.z.add("For each unvisited neighbor, w, of v:",2,35,265);
    this.z.add("call DFS(w)",3,70,310);

    this.f=54;
    this.state=0;
  }

  DFS(){
    let hlc=Orange;
    let nhr=12;
    let ehr=14;
    let node=this.stack[this.top];

    while(this.aim[this.top] < this.n){
      let aim=this.aim[this.top];
      this.aim[this.top]++;

      if(this.A[node][aim]){
        if(!this.visited[aim]){
          this.z.reset(3);
          this.top++;
          this.stack[this.top]=aim;
          this.aim[this.top]=0;
          this.visited[aim]=true;
          this.nodes[aim].highlight(hlc,1e5,nhr);
          this.edges[node][aim].highlight(hlc,1e5,ehr);
        }else{
          this.z.reset(2);
          this.edges[node][aim].highlight([247,27,7],1,ehr);
        }
        return;
      }
    }

    if(this.aim[this.top]===this.n){
      this.nodes[node].dehighlight();
      if(this.top===0){
        for(let i=0;i<this.n;i++){
          if(!this.visited[i]){
            this.stack[0]=i;
            this.aim[0]=0;
            this.visited[i]=true;
            this.state=-1;
            return;
          }
        }
        this.z.reset(4);
        this.finished=true;
        return;
      }

      this.stack[this.top]=-1;
      this.top--;
      this.edges[this.stack[this.top]][node].dehighlight();
      this.z.reset(2);
    }
  }

  show(){
    super.show();
    this.z.show();

    if(!this.finished && this.s.frameCount % this.f===0 && this.s.frameCount>this.begin){
      if(this.state===0){
        this.z.reset(1);
        this.DFS();
      }else if(this.state===-1){
        this.nodes[this.stack[0]].highlight(Orange,1e5,12);
        this.state=0;
      }
    }
  }
}

const GraphDFSScene=function(s){
  let t={
    start:frames(1),
    txt:frames(2),
    trace:frames(3)
  };
  let tnr;

  s.preload=function(){
    tnr=s.loadFont("https://cdn.jsdelivr.net/gh/JazonJiao/Manim.js@master/lib/font/times.ttf");
  };

  s.setup=function(){
    setup2D(s);
    document.getElementById("canvas-wrap").appendChild(s.canvas);
    s.g=new Graph_DFS_Demo(s,{
      V:G_DFS.V,E:G_DFS.E,font:tnr,
      start:t.start,begin:t.trace,time:t.txt,
      color_e:[7,97,7]
    });
    window._dfsGraphReady=true;
  };

  s.draw=function(){
    s.background(0);
    s.g.show();
  };
};

new p5(GraphDFSScene);
</script>
</body>
</html>
