.topic{margin:18px 0 28px;scroll-margin-top:16px}

// 各パターンは [番号, ラベル, テーマ一覧]、各テーマは [テーマ名, 学習前[知・思・主], 学習後[知・思・主], 追記[知・思・主]] の順。
const stages = [
  {index:1,title:"学習前",labels:["知っていること","疑問に思うこと","学習時に心掛けたいこと"]},
  {index:2,title:"学習後",labels:["知ったこと","疑問への答え・新たな疑問","学習時の振り返り・今後心掛けたいこと"]},
  {index:3,title:"追記",labels:["知ったこと","疑問への答え・新たな疑問","前回の振り返り・今後心掛けたいこと"]}
];
const patternSelect=document.getElementById("patternSelect");
const topicSelect=document.getElementById("topicSelect");
const answers=document.getElementById("answers");
const count=document.getElementById("patternCount");
function escapeHTML(value){return String(value).replace(/[&<>"']/g,function(char){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]})}
DATA.forEach(function(pattern){
  const option=document.createElement("option");
  option.value=pattern[0];
  option.textContent=String(pattern[0]).padStart(2,"0")+"｜"+pattern[1];
  patternSelect.appendChild(option);
});
const allOption=document.createElement("option");
allOption.value="all";
allOption.textContent="11テーマすべて";
topicSelect.appendChild(allOption);
DATA[0][2].forEach(function(item,index){
  const option=document.createElement("option");
  option.value=String(index);
  option.textContent=String(index+1).padStart(2,"0")+"｜"+item[0];
  topicSelect.appendChild(option);
});
function render(){
  const pattern=DATA.find(function(item){return item[0]===Number(patternSelect.value)})||DATA[0];
  const filter=topicSelect.value;
  count.textContent=pattern[2].length+"テーマ";
  const selected=filter==="all"?pattern[2]:pattern[2].filter(function(_,i){return String(i)===filter});
  answers.innerHTML=selected.map(function(item){
    const index=pattern[2].indexOf(item)+1;
    const stageHTML=stages.map(function(stage){
      const fields=item[stage.index];
      return '<section class="stage"><h3>'+stage.title+'</h3>'+stage.labels.map(function(label,i){
        return '<div class="answer-row"><div class="kind">'+["知","思","主"][i]+'</div><div class="answer"><strong>'+label+'：</strong>'+escapeHTML(fields[i])+'</div></div>'
      }).join("")+'</section>'
    }).join("");
    return '<article class="topic" id="topic-'+index+'"><div class="topic-heading"><span class="topic-number">'+String(index).padStart(2,"0")+'</span><h2>'+escapeHTML(item[0])+'</h2></div><div class="stages">'+stageHTML+'</div></article>'
  }).join("")||'<div class="empty">テーマがありません。</div>';
}
patternSelect.addEventListener("change",render);
topicSelect.addEventListener("change",render);
document.getElementById("printButton").addEventListener("click",function(){window.print()});
patternSelect.value=String(DATA[0][0]);
topicSelect.value="all";
render();
